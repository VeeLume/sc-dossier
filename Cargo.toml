[package]
name = "sc-dossier"
version = "0.13.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Read-only client for Star Citizen account data (blueprints, entitlements, items, loadouts, missions, reputation) from CIG's game-services gRPC backend, plus RSI's Spectrum chat/forum API, authenticated via the RSI launcher session; LIVE patch notes, comm-links, the pledge-store ship list, and player orgs from the public RSI website."
repository = "https://github.com/VeeLume/sc-dossier"
keywords = ["star-citizen", "grpc", "spectrum"]
categories = ["api-bindings"]

[dependencies]
tonic = { version = "0.14", features = [
    "transport",
    "tls-ring",
    "tls-webpki-roots",
] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

# Launcher-store decryption (AES-256-CBC + PBKDF2-HMAC-SHA512).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["serde"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
