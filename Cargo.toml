[package]
name = "sc-dossier"
version = "0.14.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Read-only client for Star Citizen account data (blueprints, entitlements, items, loadouts, missions, reputation) from CIG's game-services gRPC backend, plus RSI's Spectrum chat/forum API, authenticated via the RSI launcher session; LIVE patch notes, comm-links, the pledge-store ship list, and player orgs from the public RSI website; the game's local telemetry stream."
repository = "https://github.com/VeeLume/sc-dossier"
keywords = ["star-citizen", "grpc", "spectrum"]
categories = ["api-bindings"]

[features]
default = ["backend"]
# CIG's game-services backend, Spectrum and the RSI website: the launcher
# session, token mint, TLS gRPC and HTTP.
backend = [
    "tonic/tls-ring",
    "tonic/tls-webpki-roots",
    "dep:prost-types",
    "dep:reqwest",
    "dep:serde_json",
    "dep:aes",
    "dep:cbc",
    "dep:pbkdf2",
    "dep:sha2",
    "dep:regex",
    "dep:chrono",
]
# The game's local telemetry stream (plaintext gRPC on 127.0.0.1) and the
# `/showlocation` parser. No launcher, auth or HTTP.
telemetry = ["tokio/rt", "tokio/time"]

[dependencies]
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

prost-types = { version = "0.14", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
serde_json = { version = "1", optional = true }
regex = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["serde"], optional = true }

# Launcher-store decryption (AES-256-CBC + PBKDF2-HMAC-SHA512).
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"], optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"

[[example]]
name = "missions_dump"
required-features = ["backend"]

[[example]]
name = "reputations_dump"
required-features = ["backend"]

[[example]]
name = "spectrum_staff"
required-features = ["backend"]

[[example]]
name = "stash_dump"
required-features = ["backend"]

[[example]]
name = "telemetry_dump"
required-features = ["telemetry"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
