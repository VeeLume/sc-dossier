distribution centers.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Transport: &lt;/strong&gt;Ling Family Hauling, Covalex and FTL want goods moved to the expo platform from landing zones, distribution centers and stations in low orbit.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Collection: &lt;/strong&gt;Shubin is buying raw and crafted materials for ship manufacturing, and Adagio wants hulls broken down for recycling, including Kruger Merlins, Archimedes and Constellations.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;For more info on Rewards, please visit &lt;a href&#x3D;\&quot;https://robertsspaceindustries.com/en/comm-link/transmission/21350-FAQ-RSI-Discovery-Month\&quot; rel&#x3D;\&quot;noopener noreferrer\&quot; target&#x3D;\&quot;_blank\&quot;&gt;RSI Discovery Month FAQ.&lt;/a&gt;&lt;/p&gt;&quot;,&quot;theme&quot;:&quot;base&quot;,&quot;animations&quot;:{&quot;list&quot;:[],&quot;__typename&quot;:&quot;aria.animation&quot;},&quot;alexandriaOptions&quot;:{&quot;badgeIds&quot;:[]}},&quot;id&quot;:&quot;mg-element-86747e01&quot;}],&quot;globalAnimations&quot;:[],&quot;groups&quot;:[]}},&quot;animations&quot;:{&quot;list&quot;:[{&quot;type&quot;:&quot;mouseContainer&quot;,&quot;category&quot;:&quot;parallax&quot;}],&quot;__typename&quot;:&quot;aria.animation&quot;}} }'

2658.98828125},&quot;justify&quot;:&quot;start&quot;,&quot;align&quot;:&quot;center&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;px&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}},&quot;medium&quot;:{&quot;display&quot;:true,&quot;position&quot;:{&quot;column&quot;:0,&quot;y&quot;:0},&quot;dimension&quot;:{&quot;columnSpan&quot;:12,&quot;height&quot;:1399},&quot;justify&quot;:&quot;start&quot;,&quot;align&quot;:&quot;start&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;px&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}},&quot;large&quot;:{&quot;display&quot;:true,&quot;position&quot;:{&quot;column&quot;:11,&quot;y&quot;:0},&quot;dimension&quot;:{&quot;columnSpan&quot;:13,&quot;height&quot;:1336},&quot;justify&quot;:&quot;start&quot;,&quot;align&quot;:&quot;start&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;px&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}}},&quot;data&quot;:{&quot;text&quot;:&quot;&lt;h2 class&#x3D;\&quot;semantic-p\&quot;&gt;RSI Constellation Mk IV&lt;/h2&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;The Constellation Mk IV has been rebuilt to update the whole series to the current standards. This includes sweeping updates for a clearer bridge canopy, a repositioned airlock, new cargo and crew lifts, new turret displays, a reworked snub bay, easier component swaps in engineering, rebuilt habitation and Phoenix VIP spaces, and a full exterior art pass with new damage states and liveries.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Bridge:&lt;/strong&gt; The canopy glass has been rebuilt inside and out, and the join where the nose glass meets the bridge reworked. The large struts across that join are now gone, clearing the view for the pilot and copilot. Cockpit lighting now sits behind the glass rather than being cast onto it. Pilot and copilot seats have been reworked, the pilot seat display no longer sits off center, and the turret ring no longer catches you moving around the bridge. The flight HUD now surfaces self destruct, port, and shield prompts, which it previously did not.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Cargo and Lifts: &lt;/strong&gt;The cargo lift has been remade with its own control panel. This includes rebuilt room connectors between the lift and the cargo area, a reworked cargo grid and a relocated fuel port. The Taurus cargo bay has been rebuilt to fit the variant properly. Ladder rungs are now to metric, and the bay railings and ladders have accurate collision. The front crew lift has new animations and geometry, its control panel has been reoriented and repositioned along with new signage at the habitation deck.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Interiors:&lt;/strong&gt; Habitation areas have been updated with personal storage, and the VIP sections have been reworked with working manufacturer and lock controls, new bedding, and furniture that no longer clips or slides. Bench seats in the habs are now interactable. Every variant now has a light control panel, with lights properly linked and new glow geometry throughout.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Exterior and Materials:&lt;/strong&gt; Hull exteriors have had a full art pass with UV reprojection, corrected decals, wear detail restored across the levels of detail, and new damage states. Airlock doors have been re-exported, the interaction prompt range widened so the door no longer catches you on the way through, and door panel placement corrected on the Taurus. New paints arrive alongside the rework, including a retirement livery and an emerald livery.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Airlock:&lt;/strong&gt; The Phoenix has gained a side airlock along with the rest of the series having their airlocks and controls repositioned. The old interior handle is gone, replaced by door control panels built into the cargo bay wall on both the left and right side, so you work the airlock from inside the bay rather than reaching for the door itself. New exterior control panels have been added either side of the airlock for anyone operating it from outside the hull, and the arrow marking which side to use has been moved to match the new arrangement. The door itself has new animations and venting, and its interaction prompt now reaches far enough that you are no longer clipped by the door while opening it.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Snub bay:&lt;/strong&gt; The snub bay and the Kruger Merlin docking it uses have been reworked across the variants, including closing a gap in the collision around the bay entrance.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Turrets and weapons:&lt;/strong&gt; The top and bottom turrets now have their own displays, with new entry animations to match. Turret ranges and gimbal restrictions have been corrected, the missing buttons on the top turret are back, the top missile racks have been rebuilt, and the gap that appeared when the dorsal turret deployed is closed.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;Engineering:&lt;/strong&gt; Engineering interactions have been fixed up, component bay health corrected, and the engineering buff hardpoint repositioned.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;AI &amp;amp; Mission Use:&lt;/strong&gt; The ship now has its own AI and mission variants, which means NPC Constellations you encounter in the world fly the updated hull, and the Collector Constellation Taurus mission reward has been switched to the Gold Standard version. A full vehicle balance pass has been applied on top of all of it.&lt;/p&gt;&quot;,&quot;theme&quot;:&quot;base&quot;,&quot;animations&quot;:{&quot;list&quot;:[],&quot;__typename&quot;:&quot;aria.animation&quot;},&quot;alexandriaOptions&quot;:{&quot;badgeIds&quot;:[]}},&quot;id&quot;:&quot;mg-element-86747e01&quot;}],&quot;globalAnimations&quot;:[],&quot;groups&quot;:[]}},&quot;animations&quot;:{&quot;list&quot;:[{&quot;type&quot;:&quot;mouseContainer&quot;,&quot;category&quot;:&quot;parallax&quot;}],&quot;__typename&quot;:&quot;aria.animation&quot;}} }'

quot;sourceName&quot;:&quot;Roll_Grenade-Min&quot;,&quot;storageId&quot;:&quot;S3MediaProd&quot;}},&quot;imageTransformations&quot;:{&quot;desktop&quot;:{&quot;resize&quot;:{&quot;height&quot;:1136,&quot;width&quot;:3000},&quot;quality&quot;:85,&quot;crop&quot;:{&quot;apiArea&quot;:{&quot;width&quot;:3837,&quot;height&quot;:1452,&quot;left&quot;:0,&quot;top&quot;:0},&quot;zoom&quot;:1}},&quot;tablet&quot;:{&quot;resize&quot;:{&quot;height&quot;:568,&quot;width&quot;:1500},&quot;quality&quot;:85},&quot;mobile&quot;:{&quot;resize&quot;:{&quot;height&quot;:379,&quot;width&quot;:1000},&quot;quality&quot;:85,&quot;crop&quot;:{&quot;apiArea&quot;:{&quot;width&quot;:3837,&quot;height&quot;:1452,&quot;left&quot;:0,&quot;top&quot;:0},&quot;zoom&quot;:1}}}},&quot;widthByViewport&quot;:{&quot;desktop&quot;:1280,&quot;tablet&quot;:640,&quot;mobile&quot;:320}}},&quot;video&quot;:{&quot;heapVideo&quot;:{&quot;__typename&quot;:&quot;heap.video&quot;}},&quot;mask&quot;:{&quot;heapImage&quot;:{&quot;__typename&quot;:&quot;aria.image&quot;}},&quot;animations&quot;:{&quot;list&quot;:[],&quot;__typename&quot;:&quot;aria.animation&quot;},&quot;alexandriaOptions&quot;:{&quot;badgeIds&quot;:[]}},&quot;id&quot;:&quot;mg-element-ff992063&quot;},{&quot;key&quot;:&quot;mg.text&quot;,&quot;label&quot;:&quot;Text-2&quot;,&quot;dispositions&quot;:{&quot;small&quot;:{&quot;display&quot;:true,&quot;position&quot;:{&quot;column&quot;:0,&quot;y&quot;:410.01171875},&quot;dimension&quot;:{&quot;columnSpan&quot;:4,&quot;height&quot;:1715.98828125},&quot;justify&quot;:&quot;start&quot;,&quot;align&quot;:&quot;center&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;px&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}},&quot;medium&quot;:{&quot;display&quot;:true,&quot;position&quot;:{&quot;column&quot;:0,&quot;y&quot;:0},&quot;dimension&quot;:{&quot;columnSpan&quot;:12,&quot;height&quot;:851},&quot;justify&quot;:&quot;start&quot;,&quot;align&quot;:&quot;start&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;px&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}},&quot;large&quot;:{&quot;display&quot;:true,&quot;position&quot;:{&quot;column&quot;:0,&quot;y&quot;:0},&quot;dimension&quot;:{&quot;columnSpan&quot;:14,&quot;height&quot;:100},&quot;justify&quot;:&quot;start&quot;,&quot;align&quot;:&quot;start&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;%&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}}},&quot;data&quot;:{&quot;text&quot;:&quot;&lt;h3 class&#x3D;\&quot;semantic-p\&quot;&gt;Physics Networking Overhaul&lt;/h3&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;The netcode that governs how loose physics objects behave across the network has been rewritten. Previously the client treated the server&#x27;s view of an object as either entirely correct or entirely wrong, which meant a single bad state could cascade into persistent desync, rubber banding, and objects sliding or bouncing for no visible reason.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;The new system calculates a trust score for incoming server state rather than applying it unconditionally. Trust is reduced when the client has just done something the server cannot know about yet, such as bumping into a crate, or when the server&#x27;s state is stale. Corrections are now applied as velocity nudges rather than teleports, and a teleport is only used as a last resort, after a sweep check confirms the destination is clear. All tolerances now scale with your current latency and the size of the object rather than using fixed values.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;Throws are resolved differently as a result. Your client now reports the moment you actually released an object, and the throw is run from that release rather than from where the server last believed the object to be, so what you threw should travel the way you threw it.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;Tractor beams have been reworked along the same lines. Previously the server remembered where an item was picked up from and pulled it back toward that spot once the beam let go, which is what produced the slide and bounce you would see when setting something down. Releasing a beam now hands control over cleanly instead.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;This is paired with a collision fix. At certain angles the contact normal, the direction the physics engine believes a surface is pushing back, could come out wrong and inject extra force into an object, making it wobble, hop or spin before coming to rest.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;This change applies to freely simulated rigid bodies: cargo boxes, grenades, throwables and other loose objects. Ships, vehicles, characters and items attached to them are untouched and continue to use the previous system.&lt;/strong&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;strong&gt;As this is an experimental update we have safeguards in place that will let us revert this change on LIVE if something goes catastrophically wrong and causes major issues. &lt;/strong&gt;&lt;/p&gt;&quot;,&quot;theme&quot;:&quot;base&quot;,&quot;animations&quot;:{&quot;list&quot;:[],&quot;__typename&quot;:&quot;aria.animation&quot;},&quot;alexandriaOptions&quot;:{&quot;badgeIds&quot;:[]}},&quot;id&quot;:&quot;mg-element-86747e01&quot;}],&quot;globalAnimations&quot;:[],&quot;groups&quot;:[]}},&quot;animations&quot;:{&quot;list&quot;:[{&quot;type&quot;:&quot;mouseContainer&quot;,&quot;category&quot;:&quot;parallax&quot;}],&quot;__typename&quot;:&quot;aria.animation&quot;}} }'

></g-platform-client-component><div class="turbo-anchor" id="d0f5b658" data-plugin_key="plugin_trblt_narrative" data-position="16"></div><g-narrative-group :background-options="{&quot;isTransparent&quot;:false}" v-cloak=""><g-article :show-emphasis="false" body="<h3><u>Additional Gameplay Updates</u></h3><h4>Experimental VR Updates</h4><p>New: VR now has its own zoom, which works by narrowing the field of view. This is meant to be a temporary solution for scopes until we have fully physicalized Scopes. It's enabled for:</p><ol><li>F Interaction Zooming</li><li>ADS / Precision Targeting in ships</li><li>FPS weapon scopes</li></ol><p>A new Zoom Gameplay Strength option controls how strong the zoom is. Set it lower to reduce the effect, or set it to 0 to turn VR zoom off completely.</p><p><br></p><p>Advanced users can use these cvars for a more customized experience:</p><ul><li><strong>r_StereoZoomScopeMin </strong>(1.0): scopes at or below this magnification don't zoom.</li><li><strong>r_StereoZoomHeadTrackingRotationScale </strong>(1.0): makes the view turn less than your head while zoomed, to reduce discomfort. 0 turns it off.</li><li><strong>r_StereoZoomDisablePositionalTracking </strong>(2): limits head movement while zoomed. 0 = normal tracking, 1 = off, 2 = only forward/back.</li><li><strong>r_StereoZoomLockAngle </strong>(10): how close (in degrees) your head must point to your aim for the zoom to apply.</li><li><strong>r_StereoZoomLockReleaseScale </strong>(1.5): extra margin before the zoom releases, so it doesn't flicker.</li><li><strong>r_StereoZoomScopeAlignDistance </strong>(0.04): how close (in meters) your eye must be to the scope's line of sight.</li><li><strong>r_StereoZoomSmoothTime </strong>(0.2): how many seconds the zoom takes to ease in and out.</li></ul><p>Bug Fixes</p><ul><li>Fixed some UI icons disappearing after their spawn animation.</li><li>Fixed mouse smoothing and acceleration resetting when switching to VR.</li><li>Grounded Look now uses your aim direction for hand mining and similar actions.</li><li>In Freelook (Z), you can now aim the tractor beam with your head.</li></ul><p><br></p><h4>Characters and Items</h4><ul><li>The Heavy Combat Hunter 3 armor set arrives with its full range of tints</li><li>Three camouflage variants have been added to the RRS armor line</li><li>Nine new eyebrow options have been added to character customisation</li><li>Wikelo is now trading recipes for the Gemini LMG and Grey Combat Armour, with a new mission to go with the LMG</li><li>An RSI Constellation Mk II promotional display and an RSI branded two handed crate have been added as props</li></ul>" v-cloak=""></g-article></g-narrative-group><div class="turbo-anchor" id="e6bf2daf" data-plugin_key="plt-client.Separator" data-position="17"></div><g-platform-client-component

></g-platform-client-component><div class="turbo-anchor" id="77f903ad" data-plugin_key="plugin_trblt_rawmarkup" data-position="18"></div><A NAME="BugFixes"></A><div data-arrangement_key="fit-content-grid" class="turbo-anchor" id="edd32b04" data-plugin_key="plugin_trblt_banner_advanced" data-position="19"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:true,&quot;alignment&quot;:&quot;left-bottom&quot;,&quot;overlay&quot;:{&quot;displayed&quot;:true,&quot;opacity&quot;:0.75},&quot;logo&quot;:{&quot;displayed&quot;:false},&quot;box&quot;:{&quot;displayed&quot;:false},&quot;text&quot;:{&quot;displayed&quot;:true,&quot;overline&quot;:&quot;&quot;,&quot;title&quot;:&quot;Bug Fixes & Technical Updates&quot;,&quot;subtitle&quot;:&quot;&quot;,&quot;paragraph&quot;:&quot;<h1><br></h1>&quot;},&quot;callToAction&quot;:{&quot;displayed&quot;:false},&quot;semanticTag&quot;:{&quot;title&quot;:&quot;h2&quot;,&quot;subtitle&quot;:&quot;h3&quot;}}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/71ef891a0d6cf64a81ccfafa3944bb921f55d8ea/resize(3000,643,cover,crop(3840,823,192,0,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.jpg&quot;,&quot;tablet&quot;:&quot;/i/78d97cfcfc55c09e549f04b81ca6949829f5495f/resize(1500,322,cover,crop(3840,823,197,0,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.jpg&quot;,&quot;mobile&quot;:&quot;/i/9172732a73f5e6c3d67aab8dbf47f70705c8f520/resize(925,1646,cover,crop(925,1646,0,1457,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9M ot;imageSize&quot;:&quot;fitContent&quot;,&quot;showImage&quot;:false,&quot;showHeadline&quot;:false,&quot;showDate&quot;:false,&quot;semanticTag&quot;:{&quot;headline&quot;:&quot;h2&quot;},&quot;simpleImage&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;,&quot;tablet&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;,&quot;mobile&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;,&quot;max&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;},&quot;alt&quot;:&quot;&quot;}},&quot;blocks&quot;:[{&quot;value&quot;:{&quot;identifier&quot;:&quot;8b48738b-159f-428f-8a4f-995fe4ca2616&quot;,&quot;type&quot;:&quot;article&quot;,&quot;value&quot;:{&quot;body&quot;:&quot;\n      <p>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.</p><p>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.</p><p>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.</p><p>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.</p>\n      <h4>Ut Labore et Dolore</h4>\n      <a>Quis Nostrud Exercitation</a>\n    \n      <p>Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.</p><p>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.</p><p>Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.</p><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>\n      <h4>Quis Nostrud Exercitation</h4>\n      <a>Quis Nostrud Exercitation</a>\n    &quot;,&quot;showEmphasis&quot;:true},&quot;body&quot;:&quot;<p>For a comprehensive up to date list of Known issues and Workarounds, please check out our <a href=\&quot;https://support.robertsspaceindustries.com/hc/en-us/sections/360002667153-Known-Issues\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;><strong>Knowledge Base here</strong></a>!</p><p><br></p><p><strong>Alpha 4.10.2 closes 71 issues since 4.10.1 went live, including multiple exploits.</strong> These focus on long standing ship and item problems, vehicles going unresponsive coming out of quantum, contracts reporting themselves unavailable the moment you accepted them, landing gear and decals rendering badly across several hulls, armor and helmet sets with wrong names, missing parts or no storage, and vehicles coming out of a hangar tilted or with their engines already running. <strong>13 of those came to us directly through the Issue Council</strong>, and each one carries a link to the original report.</p><h3><br></h3><h2>Stability and Performance</h2><p>This release closes five further crash and stability issues.</p><ul><li>Fixed a client crash in the vehicle landing gear system, triggered while it was handling an event from a component that was no longer in a valid state</li><li>Resolved a client crash while mission modifiers were being applied to a player's mission log</li><li>Fixed a hang in the mission generation service while it was building out the hierarchy of the universe, which could stall contract creation, alongside optimisations to that registration path</li><li>Resolved a crash while the game was looking up a component on an object that had already been torn down</li><li>Fixed a crash while converting a game data record to a more specific type that did not match</li></ul><p><br></p><p><br></p><h3>Missions</h3><p><strong><u>Orison Relief Support</u></strong></p><ul><li>Resolved an issue where Orison Relief Support salvage contracts could be completed far faster than intended, making the reward track trivial to rush <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-219467\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-219467</a><ul><li>The hand in quantities on these contracts were set far lower than the reward track was balanced around, small enough that the whole progression could be cleared in a handful of very short runs. The required amounts have been raised substantially across the small, medium and large versions, and their difficulty ratings have been updated to match the work now involved.</li></ul></li><li>Fixed an issue where the mission item TH-01 Propulsor was listed under Containers instead of Missions in the fabricator <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-217148\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-217148</a></li><li>Fixed an issue where the TH-01 Propulsor fabricator's description had overlapping text in the crafting item preview</li></ul><p><strong><u>Siege of Orison</u></strong></p><ul><li>Fixed an issue where some comms towers would not spin again after their nodes were reset during Siege of Orison</li><li>Fixed a case where the entrance and exit doors of the Command Center airlock could suddenly open during the Siege of Orison boss fight<ul><li>The encounter runs in stages, and each stage ends when the commander's health drops to a set threshold, which is what repositions him for the next one. The final stage had no next position to move to, but the threshold still counted as the stage completing, so the doors opened and he stopped firing while he was still alive. The final stage now ends on his death instead.</li></ul></li></ul><p><strong><u>Hauling and delivery contracts</u></strong></p><ul><li>Resolved an issue where handing in all mission cargo at the first delivery point of a multi-stop hauling contract could cause the remaining cargo to disappear<ul><li>When cargo is sent down on a freight elevator for a hand in, everything on the platform is taken and anything the objective did not need is meant to come straight back as a refund. That refund path was unreliable, so leftover cargo could go missing instead of being returned. Refunds now consistently give back everything that went in and was not consumed by the objective.</li></ul></li><li>Fixed an issue where players were marked as trespassing at Cry-Astro locations while on a legal delivery mission<ul><li>The pool of locations these delivery contracts could draw from included unlawful sites, so a perfectly legal contract could route you somewhere you had no permission to be. Unlawful locations and distribution centers are now excluded when a contract picks its pickup and drop off points.</li></ul></li></ul><p><strong><u>Other mission content</u></strong></p><ul><li>Fixed an issue where animal hunting missions could send players to a location with no Kopion or Marok present <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-201484\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-201484</a><ul><li>Animal hunting contracts are built as sub contracts that inherit their creature list from a parent contract, and that inheritance was not resolving, so the sub contract never learned which animals to place. The lookup has been fixed, so the mission now knows what to spawn at the location it sends you to.</li></ul></li><li>Fixed an issue where the refractor array codes displayed as zeros during the QV Breaker Station Mining Rights missions in Nyx<ul><li>The screens that show each array's code were displaying a placeholder value rather than the code the mission had generated for that run. They now read the generated code, so what is on the screen is the code the array expects.</li></ul></li><li>Fixed an issue where the salvage objective on Battaglia contracts could reach 0% before most or all of the target ship's hull had been scraped</li><li>Fixed a problem where Eliminate Target bounty missions named the wrong vehicle for the assigned target<ul><li>The ship type in the title was taken from the contract's expected target rather than from the vehicle the target actually turned up in, and those two could differ. Rather than leave a name in there that might be wrong, the ship type has been dropped from Eliminate Target titles altogether.</li></ul></li><li>Fixed an issue where a range of contracts would report themselves as unavailable the moment you accepted them in mobiGlas<ul><li>The randomized seeding used when generating this family of contracts was interfering with the generation step itself, so the contracts it produced could not actually be taken on even though they appeared in the list. The seeding has been corrected so generation completes properly and accepted contracts stay available.</li></ul></li><li>Fixed an issue where players were missing the holographic skull head in the Arena Commander Kill Collector FPS mode while the Day of the Vara event was active</li></ul><h3><br></h3><h3>Locations and Environment</h3><p><strong><u>Stanton locations</u></strong></p><ul><li>Corrected an issue where outdated textures could be seen in the reflections on helmet visors in New Babbage<ul><li>Reflections on surfaces like visors in New Babbage are drawn from a pre-baked snapshot of the surroundings rather than rendered live, and that snapshot still held an earlier version of the location's textures. The snapshot has been regenerated against the current textures, so reflections now match what is actually there.</li></ul></li><li>Corrected an issue where the exterior sections of Distribution Centers had no harvestable resources to collect <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-214936\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-214936</a><ul><li>The harvestable resource points at Distribution Centers are generated by propagating loot setup out into the location's sub areas, and that step was failing to export for the exterior because of how the area volumes are scaled on a planet surface. The propagation and the underlying export error have both been fixed, so the outdoor sections now receive their harvestable points as intended.</li></ul></li><li>Fixed an issue where the fifth player entering a Siege of Orison instance could be left behind instead of being moved to join the rest of their party<ul><li>Late arrivals are supposed to be moved across to join the rest of their group, but the check that triggered the move looked at whether the player's data was streaming rather than at whether that machine had authority over the player. With the party owner already in the main instance, the fifth player's request was evaluated in the wrong place and never acted on. Requests are now routed to wherever authority genuinely lies.</li></ul></li><li>Fixed an issue where a strip of the landing pad at Orison had no collision <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-220532\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-220532</a><ul><li>The doorways on the exterior lobby sections had no collision backing them on one side, so at the boundary between the interior and exterior physics grids there was a gap with nothing solid underneath. Invisible collision has been added to both sides of that transition. <strong>Creatures</strong></li></ul></li><li>Fixed an issue where removing a Yormandi's eye would leave the empty socket missing its red coloring</li></ul><p><br></p><h3><br></h3><h3>Cargo and Freight Elevators</h3><ul><li>Fixed an issue where a freight elevator loading platform could snap into a raised position with cargo still on it while the doors remained closed <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-211125\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-211125</a><ul><li>Three separate problems were leaving the platform in a state that did not match reality: requests with nothing to move were still being processed, the recovery path could return items it was never meant to, and a closed platform was streaming back in using its raised position. All three have been corrected, so a platform now comes back matching the state it was actually left in.</li></ul></li><li>Resolved an issue where players could not submit cargo for several Orison Relief Support missions at once from the same freight elevator<ul><li>Two things were going wrong on the same submission path, the count of items a mission order still needed was not being tallied correctly, and stowed cargo was not checking whether an order had already been satisfied. Both have been corrected, so the elevator can now resolve several mission orders in one go instead of stalling after the first.</li></ul></li><li>Fixed an issue where carryable items lost their carry prompt once placed on a cargo grid, leaving them stuck in place</li></ul><h3><br></h3><h3>Ships and Vehicles</h3><p><strong><u>Flight, damage, and components</u></strong></p><ul><li>Fixed an issue where equipping a gimbal mount to the Origin X1 series would leave the attached weapon unable to fire or move <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-109621\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-109621</a><ul><li>The weapon hardpoint was described as holding a weapon directly, with no provision for a gimbal in between, and the pilot seat's control rules only covered a weapon mounted straight onto it. Fitting a gimbal put the weapon one step further out than the ship expected, leaving nothing for the pilot to aim or fire. The hardpoint now describes the gimbal with the weapon nested inside, and the seat's control rules cover that arrangement.</li></ul></li><li>Resolved an issue where a vehicle could become unresponsive after quantum travel on a poor connection <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-169695\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-169695</a><ul><li>On a poor connection the messages that close out quantum travel could arrive late or out of order, leaving the drive stuck part way through its shutdown with the thrusters never handed back. The end of travel sequence now handles that case, so control returns to the ship even when traffic arrives out of order.</li></ul></li><li>Fixed an issue where shields configured with a flat damage resistance applied no resistance at all<ul><li>A resistance band was only treated as valid when its minimum sat strictly below its maximum, so any shield whose resistance was set as a single flat figure failed that check and was discarded entirely. The restriction has been removed, and a flat resistance now applies as intended.</li></ul></li><li>Resolved an issue where lowering the rear ramp on all Drake Cutlass variants would raise the vehicle, preventing players from climbing in through the side doors<ul><li>The rear ramp's collision geometry and surface settings meant that lowering it pushed against the ship instead of swinging clear, levering the whole vehicle upward on its landing gear. With the hull sitting higher than intended, the side doors were out of reach of the climb in animation. The ramp's collision setup and material settings have been corrected so deploying it no longer moves the ship.</li></ul></li><li>Fixed a case where the treads on ground vehicles did not move as the vehicle drove<ul><li>Tread movement is produced by applying a scrolling material to the tread surface, but a default material had been added to the part above it, and the outer assignment takes precedence over the one the tread system applies. That conflict has been resolved so the tread system's material is the one that actually takes effect, and the treads move with the vehicle again.</li></ul></li><li>Fixed an issue where the radar display on the Mirai Pulse and Pulse LX was inverted <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-166256\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-166256</a></li><li>Corrected an issue where the Lephari radar was listed as Grade A instead of Grade C in the mobiGlas Vehicle Loadout Manager</li><li>Fixed an issue where hovering over component icons on the power management MFD displayed no name or temperature label</li><li>Corrected an issue where some ship components displayed no manufacturer logo</li><li>Resolved an issue where equipment worn by a player could deal fatal collision damage to a snub fighter docked to their ship<ul><li>Magazines on a weapon carried by the player were left without a physics parent, so while the player sat in a seat the game treated them as loose objects moving at the ship's speed. A snub docked to that ship could then be struck by them at full relative velocity. Carried magazines now stay parented to the player.</li></ul></li></ul><p><strong><u>Hangars, ASOP, and vehicle retrieval</u></strong></p><ul><li>Fixed a case where the MISC Prospector could come out tilted when retrieved from a hangar <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-208824\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-208824</a><ul><li>Not all of the Prospector's landing gear mounting points sat at the same height, so the ship could settle unevenly as it was lowered onto the pad and tip to one side. The mounting points have been levelled with one another. It only happened some of the time, which is part of why it went unresolved for so long.</li></ul></li><li>Fixed an issue where a vehicle's engines were already running when it was retrieved from a hangar <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-191084\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-191084</a><ul><li>A stored ship's power state was not being reapplied when it was placed back on the pad, so it came back powered regardless of how it was left. Power assignment on retrieval has been corrected, so a ship now arrives in the state it was stored in.</li></ul></li><li>Fixed an issue where spawning a Drake Caterpillar with a crew manifest would leave the pilot seat empty<ul><li>The Caterpillar is flown from a detachable command module, which the game handles as a separate craft docked to the hull, and the crew manifest spawn path had no support for placing an AI pilot inside a docked sub craft, so the seat was simply left empty. Spawning now creates the host ship and its attached module together as a pair and tracks the link between them per vehicle instead of per seat, so manifest crew end up in the module's pilot seat as intended.</li></ul></li><li>Resolved an issue where abandoned vehicles at some stations were not being cleaned up over time, preventing other players from landing<ul><li>Everus Harbor, Seraphim Station, Bajini Point and Port Tressler were missing the lifetime setting that tells the cleanup pass when a vehicle left sitting at a station should be removed, so nothing parked there ever aged out and pads slowly filled with derelicts. Lifetime overrides have been added for those four stations and exported for the planets they orbit, so abandoned vehicles there are now cleared on a timer like everywhere else.</li></ul></li></ul><p><strong><u>Ship art and liveries</u></strong></p><ul><li>Corrected an issue where the rear landing gear on all MISC Hull variants appeared pixelated while deploying or retracting<ul><li>The landing gear animates on its own skeleton attached to the ship, but the motion data it handed the renderer accounted only for its own animation and the ship's position, not the offset between the two from the previous frame. The renderer was therefore told the gear had moved somewhere it had not, which smeared the image while the gear travelled. That offset is now included.</li></ul></li><li>Fixed an issue where both the left and right landing gear on the Kruger Stingray appeared pixelated while retracting or deploying</li><li>Fixed an issue where the Aegis Eclipse's landing gear appeared pixelated when retracted or deployed</li><li>Fixed an issue where the Aegis Gladius Dunlevy was missing its decals on the rudders and rear wings when retrieved</li><li>Corrected an issue where the decals on physicalized storage containers aboard ships disappeared at relatively short distances</li></ul><p><strong><u>Ship interiors</u></strong></p><ul><li>Resolved an issue where vehicle modules purchased with aUEC were missing collision and caused parts of the interior to render incorrectly <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-179602\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-179602</a><ul><li>Modules were being attached as geometry hung off the vehicle's skeleton rather than as objects in their own right, so the module's collision and its interior visibility setup never travelled with it. Modules are now attached as full entities, which brings both along.</li></ul></li><li>Resolved an issue where some weapon racks in ship captain's quarters and armories appeared as placeholder objects and could not be interacted with</li><li>Corrected an issue where the bathroom door in ship habitation areas would abruptly change detail when viewed from a distance</li></ul><h3><br></h3><h3>Inventory and Items</h3><p><strong><u>Weapons and attachments</u></strong></p><ul><li>Fixed a problem where dropping a stowed heavy machine gun would place it nose down and could cause it to fall through the ground and disappear <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-218327\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-218327</a><ul><li>Dropping an item from a held or stowed slot released it from a fixed starting position that took no account of how large the item was. For something as long as a heavy machine gun that meant the weapon appeared pivoted nose down and already partly inside the floor, and in some places the physics system resolved that overlap by pushing it all the way through. Dropped items now work out their starting height from their own dimensions.</li></ul></li><li>Corrected an issue where the word \&quot;Barrel\&quot; was missing from the attachment description of the Demeco \&quot;Streamline\&quot; LMG</li></ul><p><strong><u>Armor and clothing</u></strong></p><ul><li>Corrected an issue where exploration suits displayed four consumable leg slots but only two of them could be used<ul><li>The suit's leg consumable ports are set up in pairs, and the second port in each pair had not been configured to accept consumables the way the first one was, so the slot was drawn but nothing could go into it. Both of those ports now accept consumables like their counterparts, which makes all four slots usable.</li></ul></li><li>Fixed a case where the Monolith Backpack and its variants had no storage capacity<ul><li>The backpack was inheriting its properties from the wrong template, one that defines no storage volume at all, so the pack arrived with no inventory space. It now inherits from the correct heavy backpack template and carries its intended capacity.</li></ul></li><li>Fixed an issue where all Heavy Combat Hunter 3 helmet variants did not apply the accompanying cap and neck sock when equipped</li><li>Fixed an issue where the Odyssey II Racing Helmet Alpha had no neck seal when worn with any undersuit</li><li>Resolved an issue where the Nine Tails boss helmet and its variants appeared oversized on female characters</li><li>Fixed an issue where one of the undersuit helmets appeared transparent when worn by a female character</li><li>Fixed a case where some Zeus Exploration Helmets were missing the light bulbs on the built in flashlight</li><li>Fixed an issue where the glowing red eyes on the Skullcap helmet disappeared when viewed from a distance</li><li>Fixed an issue where the Monolith Arms Liquidator used the name of the Liquidator core armor</li><li>Corrected an issue where the description for the Monolith Arms Liquidator did not match the rest of the set</li><li>Fixed a case where the Monolith Core Liquidator used the description written for the Liquidator helmet</li><li>Fixed an issue where the Morozov-CH Stronghold backpack had no name or description</li><li>Corrected an issue where a black band appeared across the forehead of the September store helmet at distance <strong>Props and flair</strong></li><li>Fixed an issue where the Bosco weapon display rack did not match its intended appearance</li><li>Resolved an issue where the RSI Venture Executive Armor Display decoration showed a placeholder name <strong>Crafting</strong></li><li>Fixed an issue where the crafting blueprints for a Juster quantum drive and a Sasu power plant pointed at the wrong components, so fabricating either produced the wrong part</li></ul><p><strong><u>Props and flair</u></strong></p><ul><li>Fixed an issue where the Bosco weapon display rack did not match its intended appearance</li><li>Resolved an issue where the RSI Venture Executive Armor Display decoration showed a placeholder name</li></ul><p><strong><u>Crafting</u></strong></p><ul><li>Fixed an issue where the crafting blueprints for a Juster quantum drive and a Sasu power plant pointed at the wrong components, so fabricating either produced the wrong part</li></ul><h3><br></h3><p><br></p><p><br></p><h2>Hotfixes Already Applied to Live</h2><p>The following went out to the Live environment in hotfix builds during the Alpha 4.10.1 window. Most of this batch was server stability work, greatly increasing server stability making shard crash loops and early server shutdowns a lot less common throughout 4.10.1.</p><p><strong>Server stability</strong> <strong>Server stability</strong></p><ul><li>Fixed an issue where a mission prop carried in a player's inventory could crash the server and hold a shard in a repeating crash loop</li><li>Resolved a server crash caused by two threads releasing the same queued entity at the same time</li><li>Resolved an issue where territory encounters at a Nyx point of interest could chain into repeated server shutdowns</li><li>Fixed an issue where game servers could shut down early while handing a player entity between them</li><li>Resolved a server crash in the entity system while resolving a component that had already been released</li><li>Fixed a crash in the physics system caused by visibility areas that were exported before a required flag existed</li><li>Resolved a crash caused by a thruster reading its flight control owner while that owner was being cleared</li><li>Added a limit on how many individual items can be unstowed onto a freight elevator platform at once, which was able to chain into server deadlocks</li></ul><p><strong>Critical errors</strong></p><ul><li>Corrected a critical error raised when an ARGO MOLE's turrets sent state updates the client could not read</li><li>Fixed a critical error where the server sent a player a method call their client had no handler for</li></ul><p><strong>Client crashes</strong></p><ul><li>Fixed a client crash in the graphics layer caused by a texture view being used after it had been marked for deletion</li></ul><p><strong>Performance</strong></p><ul><li>Fixed an issue where the audio thread could cause frame rate drops <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-214091\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-214091</a></li><li>Improved memory handling for zone partitioning to cut down on repeated allocation cycles on both client and server</li></ul><p><strong>Missions</strong></p><ul><li>Fixed an issue where the second and third Battaglia story contracts were never created on populated shards, leaving players with no follow-up after the first</li><li>Resolved an issue where contracts that rely on a Moraine Base as their location could fail to generate at all <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-216762\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-216762</a></li></ul><p><strong>Items and interface</strong></p><ul><li>Fixed an issue where super heavy armor could not be unequipped into local inventory while items were still attached to it</li><li>Resolved an issue where arrow key and gamepad navigation in mobiGlas lost focus one frame after every press</li><li>Corrected an issue where the heavy footstep audio from the H4 superheavy suit stayed on the player after the armor was removed</li></ul><p><strong>Visuals</strong></p><ul><li>Corrected an issue where holographic displays could render incorrectly from certain angles with upscaling enabled</li><li>Fixed several water problems, including missing simulation on ships and broken shading on water volumes and rivers</li></ul>&quot;},&quot;type&quot;:&quot;article&quot;}]}}" v-cloak=""></g-platform-client-component><div id="aria-skin-info" data-orion-skin="generic.default.base-" style="position:absolute; top:0, left:0;"></div>
