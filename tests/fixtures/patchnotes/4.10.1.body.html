oBMgnt2SstX1zNThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ))/85/patch-4-0-webclip-jumppoints.webp&quot;,&quot;mobile&quot;:&quot;/i/271a36ba1f0db320c9ae49eebfea6c864efece77/resize(4,57,cover,crop(1096,1950,0,1344,99pyU5Ga1kws2m4gSzxfoQwKvFgccWnK5JkSm22zVdhro2MQpdLwFt3JtwXyhd4H24JoBMgnt2SstX1zNThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ))/85/patch-4-0-webclip-jumppoints.webp&quot;,&quot;max&quot;:&quot;/i/ff49b53376e61ca50b88f6e29f47fc3c4c22b756/99pyU5Ga1kws2m4gSzxfoQwKvFgccWnK5JkSm22zVdhro2MQpdLwFt3JtwXyhd4H24JoBMgnt2SstX1zNThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ/patch-4-0-webclip-jumppoints.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Patch 4 0 Webclip JumpPoints&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="fit-content-grid" v-cloak=""></g-banner-advanced><div class="turbo-anchor" id="c91dae84" data-plugin_key="plugin_trblt_faq" data-position="7"></div><g-faq :background-options="{&quot;isTransparent&quot;:false}" :show-expand-all-button="true" :expand-all="true" :question-list="[{&quot;title&quot;:&quot;Gameplay: Orison Relief Support - Ground Vehicle Soft Death - Loot Quality and Attachment Availability&quot;,&quot;content&quot;:&quot;<h4>Orison Relief Support</h4><p>Crusader Industries' relief initiative is now live. In the wake of the Nine Tails attack, Orison needs rebuilding and its defenses need upgrading, and Crusader is paying anyone willing to help.</p><p>Contracts come from four providers. Cornerstone Developments handles reconstruction, running resource gathering work into Orison and Seraphim alongside a crafted aid line built around the TH-01 Propulsor. Covalex and Ling cover the medical response, collecting medical supplies and iodine from New Babbage, the New Babbage rooftops and Port Tressler for delivery into Orison, the Orison rooftops and Seraphim. Foxwell handles security, with ship ambush and wave attack contracts in space and an Eliminate All contract clearing Nine Tails out of outposts on foot.</p><p>Every contract you complete feeds your own progress track rather than paying out in isolation. Progress is personal, so you are working toward your own rewards at your own pace, and each reward is granted straight to your account as you pass its threshold. Six rewards are on offer, unlocking in this order:</p><ul><li>S-38 \&quot;SecondWind\&quot; Pistol</li><li>FBL-8a SecondWind Light Armor</li><li>P4-AR \&quot;SecondWind\&quot; Rifle</li><li>ORC-mkX SecondWind Medium Armor</li><li>Lumin V \&quot;SecondWind\&quot; SMG</li><li>ADP-mk4 SecondWind Heavy Armor</li></ul><p>Rewards are granted as finished items rather than as blueprints to craft. Points earned on a contract completed as a party are divided between the party members.</p><p>The crafted aid line needs an Item Fabricator. The TH-01 Propulsor blueprint is attached to the contract and can be found on the fabricator's own terminal, which will list the materials required. If you do not own a fabricator yet you will need to buy one from a shop, unload it at a freight elevator and set it up in a hangar or a ship's cargo bay.</p><h4><br></h4><h4>Ground Vehicle Soft Death</h4><p>Ground vehicles can now enter the soft death state, bringing them in line with ships. A disabled ground vehicle will now be left inert rather than going straight from working to destroyed.</p><p><br></p><h4>Creature and Plant Loot Quality</h4><p>Loot harvested from creatures and plants now comes in graded quality brackets. Kopion horns, Marok pearls, Valakkar fangs and pearls, Yormandi eyes, Quasigrazer eggs and tongues, gasping weevil eggs and ranta dung are all covered, alongside a wide range of harvestable plants including spiral fruit, sunset berries, jumping limes, degnous root and heart of the woods. What you bring back is worth checking before you sell it or craft with it.</p><p><br></p><h4>Weapon Attachment Availability</h4><p>Barrel compensators and stabilizers across all three sizes are now available from the general loot pool rather than being restricted to a narrow set of sources, so attachments turn up far more reliably while looting.</p><p><br></p><h4>Hauling and Delivery Cargo Distribution</h4><p>The way contract cargo is distributed across pickup locations has been reworked. Multi-pickup contracts now account for the SCU weight of each individual pickup when splitting a load, so cargo is spread across the markers the contract actually gives you instead of stacking into a single inventory, and percentile-based cargo amounts now resolve correctly.</p><p><br></p><h4>Audio</h4><ul><li>Spaceship and shared audio work has been brought forward into this build, along with an Aegis Sabre series audio remake</li><li>Audio has been added for the AMRS S3 and S4 laser cannons</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:false}}]"></g-faq><div class="turbo-anchor" id="77f903ad" data-plugin_key="plugin_trblt_rawmarkup" data-position="8"></div><A NAME="BugFixes"></A><div data-arrangement_key="fit-content-grid" class="turbo-anchor" id="edd32b04" data-plugin_key="plugin_trblt_banner_advanced" data-position="9"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:true,&quot;alignment&quot;:&quot;left-bottom&quot;,&quot;overlay&quot;:{&quot;displayed&quot;:true,&quot;opacity&quot;:0.75},&quot;logo&quot;:{&quot;displayed&quot;:false},&quot;box&quot;:{&quot;displayed&quot;:false},&quot;text&quot;:{&quot;displayed&quot;:true,&quot;overline&quot;:&quot;&quot;,&quot;title&quot;:&quot;Bug Fixes & Technical Updates&quot;,&quot;subtitle&quot;:&quot;&quot;,&quot;paragraph&quot;:&quot;<h1><br></h1>&quot;},&quot;callToAction&quot;:{&quot;displayed&quot;:false},&quot;semanticTag&quot;:{&quot;title&quot;:&quot;h2&quot;,&quot;subtitle&quot;:&quot;h3&quot;}}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/71ef891a0d6cf64a81ccfafa3944bb921f55d8ea/resize( ,cover,crop(925,1646,0,1457,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;max&quot;:&quot;/i/597b95c2c37505d8adff59fde6f6478bee866ee1/2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;__typename&quot;:&quot;GenerateURIsResponseDto&quot;,&quot;placeholder&quot;:{&quot;desktop&quot;:&quot;/i/1a26d5206bc25706fff0a33040eac03f5d836cf1/resize(4,7,cover,crop(3840,823,192,0,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;tablet&quot;:&quot;/i/25b582f16955291b438b8c55e339696a97dcb197/resize(4,7,cover,crop(3840,823,197,0,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;mobile&quot;:&quot;/i/a3d47d4ce494391bf2a6529cb58299946d43f834/resize(4,57,cover,crop(925,1646,0,1457,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;max&quot;:&quot;/i/597b95c2c37505d8adff59fde6f6478bee866ee1/2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Star Citizen Coramor 2024 Community Contest 4K&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="fit-content-grid" v-cloak=""></g-banner-advanced><div class="turbo-anchor" id="d0f5b658" data-plugin_key="plugin_trblt_narrative" data-position="10"></div><g-narrative-group :background-options="{&quot;isTransparent&quot;:false}" v-cloak=""><g-article :show-emphasis="false" body="<p>For a comprehensive up to date list of Known issues and Workarounds, please check out our <a href=&quot;https://support.robertsspaceindustries.com/hc/en-us/sections/360002667153-Known-Issues&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;><strong>Knowledge Base here</strong></a>!</p><p><br></p><p>Alpha 4.10.1 closes <strong>37 issues</strong>, with a focus on problems that could cost you an entire session. These include contract cargo spawning in the wrong location, vehicles that couldn’t be retrieved from ASOP terminals, freight elevators getting stuck mid-transfer, and multiple exploits.</p><p><strong>16 of those 37 fixes came through the Issue Council</strong>, and each one includes a link to the original report. Your reports, confirmations, and reproduction steps help us reliably recreate issues and prioritize them alongside everything else.</p><p>Many of the fixes in this patch were pinned down thanks to players providing detailed information from different angles. Thank you to everyone who took the time to contribute!</p><ul><li>Client Crashes: 3</li><li>Server crashes: 2</li></ul><p><br></p><h4>Client crashes fixed</h4><ul><li>Fixed a crash that could occur while characters and creatures were being animated on screen. The renderer could release a character's mesh while that same mesh was still being deformed for the frame being drawn.</li><li>Resolved a crash that occurred as an object registered itself with the system that tracks which part of the world it belongs to. If the object and its parent disagreed about what they were attached to, which could happen with items and components mounted on a ship, the mismatch would take the client down.</li><li>Fixed a crash while calculating an object's position, rotation and scale in the world, triggered by an object being left with an invalid transform.</li></ul><h3><br></h3><h4>Missions</h4><p><strong><u>Hauling and cargo contracts</u></strong></p><ul><li>Fixed an issue where multi-pickup contract cargo could all sit in a single pickup location's inventory despite the contract showing several pickup markers <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-202557&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-202557</a></li><li>Resolved an issue where some hauling contracts would not spawn enough cargo at the collect locations <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-217295&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-217295</a></li><li>Fixed an issue where Covalex delivery contracts would not spawn the full amount of cargo for pickup <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-206770&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-206770</a></li></ul><p>The three hauling and cargo fixes came out of larger distribution work for 4.10.1. Contract cargo distribution was reworked because the old code split a load across pickup locations without accounting for how much each individual pickup was actually carrying, so it could put everything in one place while still handing you several markers. Alongside that, percentile based cargo amounts were resolving incorrectly, cargo generation had an off by one error, and nothing validated that the number of dropoffs matched the number of pickups. Distribution now weights each pickup by its SCU, the percentile and off by one errors are fixed, and a mismatch between pickup and dropoff counts now raises an error rather than generating a contract you cannot finish.</p><p><strong><u>Refuelling contracts</u></strong></p><ul><li>Fixed an issue where the contract details listed the wrong amount of fuel, and introductory refuelling contracts asked for quantum fuel as well as hydrogen <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-218420&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-218420</a><ul><li>Introductory refuelling contracts were asking for quantum fuel as well as hydrogen, so the amount shown in the contract never matched the job in front of you. Those contracts now ask for hydrogen only.</li></ul></li><li>Corrected an issue where the refuelling interface displayed the wrong price per SCU of fuel</li></ul><p><strong><u>Other mission content</u></strong></p><ul><li>Fixed an issue where the Tactical Strike Group Full Strike contract would not progress past the Go To Objective step <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-218828&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-218828</a><ul><li>The mission logic could not find the harvestable container it was looking for at the objective, so the step never registered as complete and the contract stalled there permanently.</li></ul></li><li>Resolved an issue where the Nine Tails commander in Siege of Orison was equipped with the wrong heavy machine gun variant</li></ul><h4><br></h4><h4>Locations and Environment</h4><p><strong><u>Stanton locations</u></strong></p><ul><li>Fixed an issue where armistice zones were missing throughout Orison <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-217142&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-217142</a><ul><li>Orison's armistice areas were being skipped while the game worked out which zones were active, which left the whole location without weapon restrictions. Area resolution has been corrected so the armistice zones apply again.</li></ul></li></ul><p><strong><u>Pyro</u></strong></p><ul><li>Fixed an issue where the irradiated Valakkar egg would not appear at the Lazarus Complex <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-192834&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-192834</a><ul><li>The egg nursery was running on a reset cycle far longer than the window players were arriving in, so the egg was usually absent. The nursery now resets on a much shorter cycle.</li></ul></li></ul><h4><br></h4><h4>Ships and Vehicles</h4><p><strong><u>Flight, damage and components</u></strong></p><ul><li>Fixed an issue where most of the Drake Clipper's hull took no damage, and where the underside doors could not be damaged <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-219126&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-219126</a><ul><li>The Clipper's body had several overlapping collision shapes layered on top of each other, so incoming fire never resolved against the hull itself and the ship read as effectively invulnerable across most of its surface. The duplicates have been removed and the doors on the underside are now proper damageable parts.</li></ul></li><li>Resolved an issue where ground vehicles were unable to enter the soft death state<ul><li>Ground vehicles had no disabled state at all, so they went straight from working to destroyed. They now have one, matching how ships behave.</li></ul></li><li>Fixed a case where ship computer dialogue lines would not play while the player was in the pilot seat <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-216621&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-216621</a></li><li>Corrected an issue where the vehicle compass read a different bearing in the pilot seat than it did on foot <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-103033&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-103033</a></li></ul><p><strong><u>Hangars, ASOP, and vehicle retrieval</u></strong></p><p>Both fixes below share a root cause. A vehicle landed inside a hangar was not guaranteed to be put away when that hangar was stowed, streamed out or deleted, so it could be left in a state where neither the hangar nor the terminal considered it dealt with. Vehicles landed inside a hangar now always stow in all three of those cases, and a flag that was failing to clear properly has been fixed, which covered the remaining cases where a vehicle got stuck between being stored and a new ship being spawned.</p><ul><li>Fixed an issue where the Retrieve button on ASOP terminals could become greyed out, leaving a vehicle impossible to spawn, retrieve or deliver <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-214984&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-214984</a></li><li>Resolved an issue where ships would stay stuck on &quot;moving to storage&quot; if the player streamed out of the hangar while it was still storing <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-205267&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-205267</a></li></ul><p>Both of the Air Traffic Control fixes below trace to the same place. The keybinding and the comms call each looked up the nearest ATC contact for themselves, and the lookup used by the keybinding did not handle zone and instance roots correctly, so it frequently found nothing to talk to while the comms call worked fine. That lookup has been corrected, and the keybinding now reaches ATC in the same cases the comms call does.</p><ul><li>Fixed an issue where the hotkey to request landing or takeoff from Air Traffic Control did nothing, while the comms call still worked <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-217211&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-217211</a></li><li>Resolved an issue where Air Traffic Control could not be contacted at all through its keybinding shortcut</li><li>Fixed a problem where the Kruger S-65 Stingray would spawn partly inside the hangar floor</li></ul><p><strong><u>Ship art and liveries</u></strong></p><ul><li>Fixed an issue where equipping certain liveries left the Aegis Sabre's landing gear showing a placeholder texture<ul><li>The landing gear was built in a format that did not carry the material assignments the liveries needed. It has been rebuilt and its material IDs remapped, with a separate pass to stop overlapping surfaces flickering against each other.</li></ul></li></ul><h3><br></h3><h4><u>Cargo and Freight Elevators</u></h4><ul><li>Fixed an issue where raising a freight elevator at its maximum capacity would leave it stuck in a transferring state<ul><li>Opening the kiosk while an unstow request was still being processed queued a second request to open the inventory, and the platform was then left waiting on a transfer that never arrived. A guard now blocks that second request until the first has finished.</li></ul></li><li>Resolved an issue where loading platform state recovery could snap the platform into a raised position with cargo still on it and the doors closed <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-211125&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-211125</a></li><li>Fixed a case where a delivery failure error would appear when storing cargo left on a freight elevator grid after exiting and returning to the game<ul><li>The platform and the server disagreed about the gravity acting on the cargo, which made the stored contents fail validation. The platform now rechecks gravity when the kiosk is opened.</li></ul></li></ul><h4><br></h4><h4>UI</h4><p><strong><u>Starmap, markers, and navigation</u></strong></p><p>These two came out of the same investigation. The orbital markers the router uses to plot a path around Stanton's star were disabled, so any route passing near the star failed outright rather than curving around it. Fixing that exposed a second case: the router was not generating points around a space station either, so a destination on the far side of the station you were sitting in would also refuse to set. Both now route correctly.</p><ul><li>Fixed an issue where the Starmap would not plot a route around an obstructed path <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-130415&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-130415</a><ul><li>Large bodies sitting between you and your destination, including the Stanton star itself, were treated as hard blockers rather than something to route around, so no course would be set at all.</li></ul></li><li>Resolved an issue where a quantum route could not be set from inside a station to a destination on the far side of it</li></ul><p><strong><u>Main menu and front end</u></strong></p><ul><li>Fixed an issue where a line in the pause menu was out of place</li></ul><h3><br></h3><h3>Inventory and Items</h3><p><strong><u>Weapons and attachments</u></strong></p><ul><li>Fixed an issue where weapon attachments were missing from the loot pool at Distribution Center delving sites and elsewhere</li></ul><p><strong><u>Armor and clothing</u></strong></p><ul><li>Resolved an issue where the Nine Tails Shogun armor set had no tints available</li><li>Fixed an issue where the Nine Tails Shogun armor showed item boxes instead of the armor in inventory previews</li><li>Corrected an issue where text on the legs of the September store armor read incorrectly</li></ul><p><strong><u>Props and flair</u></strong></p><ul><li>Fixed an issue where the Bosco weapon display rack did not match its reference image</li><li>Corrected a spelling error in the description of the M80 &quot;Beauty Is Power&quot; poster</li></ul><h4><br></h4><p><br></p><p><br></p><h3>Fixed by Hotfix Since 4.10.0 Went Live</h3><p>The following <strong>26 fixes</strong> reached the live environment a hotfixes in the weeks after 4.10.0 launched.</p><p><strong>Server stability</strong></p><ul><li>Fixed a server crash caused by a mission prop sitting in a player's inventory, which could hold a shard in a repeating crash loop for over an hour</li><li>Resolved a server crash where the same object could be queued for cleanup twice and deleted twice</li><li>Fixed a server crash while looking up a component that had already been released</li><li>Resolved a server crash when a ship's thruster was asked for its capacity while its flight system was being torn down</li><li>Fixed memory corruption caused by several parts of the game reading a weapon's fire modes at the same time as they were being cleared</li><li>Fixed a crash in the physics system when moving through areas exported before a newer collision check existed</li><li>Added a limit on how many loose items can be unstowed onto a freight elevator platform at once, which was capable of chain crashing a server</li><li>Resolved an issue where entering a vehicle could overwrite the previous driver without clearing them first, putting the client and server out of step</li></ul><p><br></p><p><strong>Disconnects</strong></p><ul><li>Fixed a family of issues where a server node would shut down immediately and disconnect everyone on it<ul><li>The server was accepting a confirmation that an object's layout was final without checking that the layout it had actually matched the one being confirmed. When they disagreed, the node exited rather than continuing. It now verifies the layout first. This covered several separate reports, including repeating shutdowns around the Nyx points of interest and a bad variable index on the ARGO MOLE's turrets.</li></ul></li></ul><p><strong>Client crashes</strong></p><ul><li>Fixed a client crash in the graphics layer where a texture view could still be in use while it was being discarded, which surfaced after memory defragmentation was introduced</li></ul><p><strong>Performance</strong></p><ul><li>Resolved an issue where the audio thread could cause significant frame rate drops, and a related audio crash <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-214091&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-214091</a></li><li>Improved memory handling for the system that partitions the world into regions, which was allocating and freeing far too often</li><li>Restored optimization on a number of files where it had been accidentally left disabled</li></ul><p><strong>Missions</strong></p><ul><li>Fixed an issue where Battaglia's second and third story contracts were never created on busy shards, leaving players with no follow-up after the first <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-218134&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-218134</a><ul><li>Mission generation was querying locations using stored identifiers that are not valid on every shard, and the caches backing those queries were not being cleared properly when a shard started up. Missions that depended on a Moraine base as their location were the most visible casualty.</li></ul></li><li>Resolved an issue where the Nine Tails commander in Siege of Orison could take collision damage while being teleported between phases, and die instantly</li></ul><p><strong>Ships and vehicles</strong></p><ul><li>Fixed an issue where a vehicle with an expired idle timer was impounded again within seconds of every retrieval</li></ul><p><strong>Items and interface</strong></p><ul><li>Fixed an issue where Super Heavy armor could not be unequipped to local inventory if anything was attached to it</li><li>Resolved an issue where the mech style footstep audio from the Super Heavy suit kept playing after the armor was unequipped <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-213441&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>STARC-213441</a></li><li>Fixed an issue where arrow key and gamepad D-pad navigation stopped working in mobiGlas, because a mouse position update sent every frame was clearing the keyboard focus one frame after each press</li></ul><p><strong>Visuals</strong></p><ul><li>Fixed an issue where holograms could render incorrectly from certain angles when upscaling was enabled</li><li>Resolved several water issues, including simulation not running on ships and broken shading on water volumes and rivers</li></ul>" v-cloak=""></g-article></g-narrative-group><div class="turbo-anchor" id="c0794a69" data-plugin_key="plugin_trblt_rawmarkup" data-position="11"></div><A NAME="KnownIssues"></A><div id="aria-skin-info" data-orion-skin="generic.default.base-" style="position:absolute; top:0, left:0;"></div>
