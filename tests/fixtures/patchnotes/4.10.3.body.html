start&quot;,&quot;align&quot;:&quot;start&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;px&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}}},&quot;data&quot;:{&quot;text&quot;:&quot;&lt;h5 class&#x3D;\&quot;semantic-p\&quot;&gt;New Mission:&lt;/h5&gt;&lt;h3 class&#x3D;\&quot;semantic-p\&quot;&gt;InterSec Defense Solutions&lt;/h3&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;Vanduul forces are moving into Nyx, and InterSec Defense Solutions is contracting pilots to push them back. A new set of missions is available from InterSec at Rank 1, alongside the technology smuggling work.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;These contracts send you into deep space to new points of interest across the system. You will exterminate Vanduul clans, take down Maulers, retake and defend ships, hold a three way standoff, follow a missing person case into an ambush, and raid Shattered Blade positions on foot. Expect Blades, Glaives, Scythes, Stingers and the Mauler which is Vanduul&#x27;s latest destroyer as part of the new Seek and Destroy contracts, which run at the hardest difficulty tiers InterSec offers. The combat music from Welcome to Nyx plays during Vanduul engagements, and Vanduul crews call out to each other as they fight.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;ol&gt;&lt;li&gt;Shattered Blade Raid (Rank 1): Clear Shattered Blade forces out of auxiliary stations scattered across the Nyx system&lt;/li&gt;&lt;li&gt;Retake Ship (Rank 2): A vessel has been boarded by the Shattered Blade. Get aboard and take it back&lt;/li&gt;&lt;li&gt;Vanduul Clan Extermination (Rank 4): Hold out against escalating waves of Vanduul ships across three difficulty tiers&lt;/li&gt;&lt;li&gt;3-Way Standoff (Rank 4): You, the Vanduul and the Shattered Blade all converge at once. Everyone is a target, including you&lt;/li&gt;&lt;li&gt;[redacted] Takedown (Rank 4 to 6): Fight through waves of Vanduul until a [redacted] is drawn to the incursion site, across five difficulty tiers&lt;/li&gt;&lt;li class&#x3D;\&quot;semantic-p\&quot;&gt;Gather Vanduul Cryopod: Recover cryopods from the field&lt;/li&gt;&lt;/ol&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;Recovered from these missions is a new cryopod variant containing Vanduul, worth more than the standard pod.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;Mission rewards come as blueprints: the LBCO Skarnov Rifle, three sizes of BEHR laser cannons, the Tailwind flight suit, Palatino heavy armor, and Corbel heavy armor sets, each with a military themed tint.&lt;/p&gt;&quot;,&quot;theme&quot;:&quot;base&quot;,&quot;animations&quot;:{&quot;list&quot;:[],&quot;__typename&quot;:&quot;aria.animation&quot;},&quot;alexandriaOptions&quot;:{&quot;badgeIds&quot;:[]}},&quot;id&quot;:&quot;mg-element-86747e01&quot;}],&quot;globalAnimations&quot;:[],&quot;groups&quot;:[]}},&quot;animations&quot;:{&quot;list&quot;:[{&quot;type&quot;:&quot;mouseContainer&quot;,&quot;category&quot;:&quot;parallax&quot;}],&quot;__typename&quot;:&quot;aria.animation&quot;}} }'

;:0},&quot;dimension&quot;:{&quot;columnSpan&quot;:13,&quot;height&quot;:625},&quot;justify&quot;:&quot;start&quot;,&quot;align&quot;:&quot;start&quot;,&quot;locked&quot;:false,&quot;yUnit&quot;:&quot;px&quot;,&quot;padding&quot;:{&quot;left&quot;:0,&quot;right&quot;:0}}},&quot;data&quot;:{&quot;text&quot;:&quot;&lt;h5 class&#x3D;\&quot;semantic-p\&quot;&gt;New FPS Weapon:&lt;/h5&gt;&lt;h3&gt;LBCO Skarnov Rifle&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Weight: Average&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Fire modes: Fully automatic / Single&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Damage: 27&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Projectile Velocity: 500&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Aim down Sight Time: 0.25&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;RPM: 375&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Mag size: 30&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Electrical Jump Range - 5M&lt;/li&gt;&lt;li&gt;&amp;nbsp;&amp;nbsp;Max Jump range 3m&lt;/li&gt;&lt;/ul&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;It&#x27;s been a while since the Lightning Bolt Co. has unleashed a weapon onto the verse but with this new fully automatic DMR, they&#x27;re here to make an impression.&lt;/p&gt;&lt;p&gt;&lt;br&gt;&lt;/p&gt;&lt;p&gt;The Skarnov rifle, like the other LBCO weapons leaves the target with an electrified pulse that denotates and chains to other nearby targets causing devastation for enemies in tight proximity. It&#x27;s got a really consistent but high vertical recoil profile allowing skills operators to shut down highly armored enemies easily but as an energy weapon the danger of over heating is present.&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;&lt;br&gt;&lt;/p&gt;&lt;p class&#x3D;\&quot;semantic-p\&quot;&gt;The Skarnov rifle is effected by the atmospheric temperatures its used in, causing hot environments to cause overheat faster and colder environments to build up heat slower.&amp;nbsp;&lt;/p&gt;&quot;,&quot;theme&quot;:&quot;base&quot;,&quot;animations&quot;:{&quot;list&quot;:[],&quot;__typename&quot;:&quot;aria.animation&quot;},&quot;alexandriaOptions&quot;:{&quot;badgeIds&quot;:[]}},&quot;id&quot;:&quot;mg-element-86747e01&quot;}],&quot;globalAnimations&quot;:[],&quot;groups&quot;:[]}},&quot;animations&quot;:{&quot;list&quot;:[{&quot;type&quot;:&quot;mouseContainer&quot;,&quot;category&quot;:&quot;parallax&quot;}],&quot;__typename&quot;:&quot;aria.animation&quot;}} }'
  
></g-platform-client-component><div class="turbo-anchor" id="1fd7796a" data-plugin_key="plt-client.Separator" data-position="13"></div><g-platform-client-component

></g-platform-client-component><div class="turbo-anchor" id="d0f5b658" data-plugin_key="plugin_trblt_narrative" data-position="14"></div><g-narrative-group :background-options="{&quot;isTransparent&quot;:false}" v-cloak=""><g-article :show-emphasis="false" body="<h3><strong>Ships &amp; Vehicles</strong></h3><p><br></p><h4>New Ship: RSI Galaxy</h4><p>The RSI Galaxy is a large multi-crew ship built around a swappable central module allowing players to swap out roles when needed.</p><p>The <strong>Cargo Module</strong> takes the Galaxy from its base 64 SCU up to <strong>720 SCU</strong> and adds an industrial grade lift, along with tractor beam consoles for loading and unloading.</p><p>The <strong>Med Bay Module</strong> turns the bay into a field hospital with <strong>Tier 1, 2, and 3 medbeds</strong>..</p><p><br></p><h4>New Ship: Anvil Liberator</h4><p>The Liberator is a heavy carrier for ships and ground vehicles. Ground vehicles load through the rear ramp into the vehicle bay, while ships either fit inside the interior hangar or set down on the landing pads, some within the hull and some along the upper exterior. Anything parked inside the Liberator can use landing services for repair, rearm, and refuel.</p><p><br></p><h4><strong>Size 3 Radars</strong></h4><p>The Carrack, Perseus, Starlancer, Starlancer TAC, Hammerhead and Tiburon now carry Size 3 radars in place of Size 2, with their default loadouts updated to match. The component bays housing them have been reworked to fit the larger units, which has moved the Perseus relay onto a console and relocated the Starlancer radar into engineering.</p><p><br></p><h4><strong>Bomb Racks</strong></h4><p>Size 1 and Size 3 bomb racks are now sold at the weaponry kiosk in the Crusader Showroom at Orison, in left and right hand mountings.</p><p><br></p><h4><strong>Ships on Sale for aUEC</strong></h4><p>A number of already flyable ships can now be bought in game for the first time with aUEC.</p><ul><li>The Aegis Tiburon and MISC Starlite are stocked at New Deal in Lorville,</li><li>The Drake Ironclad, Drake Pitbull and MISC Starlite at Teach's Ship Shop on Levski,</li><li>The Drake Ironclad Assault, Drake Pitbull, and Grey's Market Basher can now be purchased in Rundown Station in Pyro</li><li>The Origin M80 and Gatac Tyilui can now be purchased in Astro Armada in Area18.</li></ul><p><br></p><h4><strong>Additional Ship Updates</strong></h4><ul><li>The Esperia Prowler Utility's pilot and copilot dashboards have a new interaction that opens the cargo bay doors on their own, without dropping the rear ramp</li><li>Ship HUD holograms are now tinted to match the manufacturer of the vehicle</li></ul><h4><br></h4>" v-cloak=""></g-article></g-narrative-group><div class="turbo-anchor" id="261163a8" data-plugin_key="plt-client.Separator" data-position="15"></div><g-platform-client-component

  :properties='{ "componentId": "Separator", "componentProps": {&quot;variant&quot;:&quot;outline&quot;,&quot;alignment&quot;:&quot;top-right&quot;,&quot;__typename&quot;:&quot;orion.separator&quot;} }'
  
></g-platform-client-component><div class="turbo-anchor" id="8029a88a" data-plugin_key="plugin_trblt_narrative" data-position="16"></div><g-narrative-group :background-options="{&quot;isTransparent&quot;:false}" v-cloak=""><g-article :show-emphasis="false" body="<h3>Balance and Tuning</h3><h3>Salvage</h3><ul><li>Hull munching capacity has been increased across the salvage fleet: Reclaimer from 240 to 448 SCU, Argo MOTH from 64 to 240 SCU, Vulture from 13 to 16 SCU, MISC Fortune from 13 to 14 SCU and RSI Salvation from 6 to 8 SCU</li><li>The disintegration field on all five has been enlarged, with a more forgiving falloff on alignment, so holding a cut on a hull is less exacting</li></ul><p><br></p><h4>Vanduul Combat</h4><ul><li>Vanduul AI ships now carry greater ammunition capacity and regenerate ammunition faster, making them markedly more aggressive in sustained fights</li><li>The Mauler's weapons have been made considerably more deadly</li><li>The Mauler's health has been reduced to balance against its increased firepower</li></ul><p><br></p><h4>Missions and Reputation</h4><ul><li>High Risk Target bounty contracts now award 4,000 Bounty Hunters Guild reputation rather than 2,000, placing them correctly between Medium Risk and Very Hard contracts</li></ul><p><br></p><h4>Ship Weapons</h4><ul><li>The minimum arming distance on Size 5 and Size 7 torpedoes has been raised to 700m</li></ul><h4><br></h4>" v-cloak=""></g-article></g-narrative-group><div class="turbo-anchor" id="e6bf2daf" data-plugin_key="plt-client.Separator" data-position="17"></div><g-platform-client-component

ot;imageSize&quot;:&quot;fitContent&quot;,&quot;showImage&quot;:false,&quot;showHeadline&quot;:false,&quot;showDate&quot;:false,&quot;semanticTag&quot;:{&quot;headline&quot;:&quot;h2&quot;},&quot;simpleImage&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;,&quot;tablet&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;,&quot;mobile&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;,&quot;max&quot;:&quot;https://robertsspaceindustries.com/i/814eb54fefacc261c91baa98aaa6a52465c614b2/resize(1820,1024,cover,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResiuUyFm9bmah2D5Kw7881xeAayUzmjSaXp)/source.webp&quot;},&quot;alt&quot;:&quot;&quot;}},&quot;blocks&quot;:[{&quot;value&quot;:{&quot;identifier&quot;:&quot;8b48738b-159f-428f-8a4f-995fe4ca2616&quot;,&quot;type&quot;:&quot;article&quot;,&quot;value&quot;:{&quot;body&quot;:&quot;\n      <p>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.</p><p>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.</p><p>Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.</p><p>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.</p>\n      <h4>Ut Labore et Dolore</h4>\n      <a>Quis Nostrud Exercitation</a>\n    \n      <p>Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.</p><p>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident.</p><p>Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt.</p><p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>\n      <h4>Quis Nostrud Exercitation</h4>\n      <a>Quis Nostrud Exercitation</a>\n    &quot;,&quot;showEmphasis&quot;:true},&quot;body&quot;:&quot;<p>For a comprehensive up to date list of Known issues and Workarounds, please check out our <a href=\&quot;https://support.robertsspaceindustries.com/hc/en-us/sections/360002667153-Known-Issues\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;><strong>Knowledge Base here</strong></a>!</p><p><br></p><h2>Stability and Performance</h2><p>This release closes 13 crash and stability issues.</p><p><strong>Server</strong></p><ul><li>Fixed a server deadlock on the main thread while an entity was being detached and queued for deletion</li><li>Resolved a server crash while a player's mission log was being read</li><li>Fixed a server crash in the mission refund path caused by a division by zero</li><li>Addressed a server memory leak where a mission queue fed by interactable objects grew without limit</li></ul><p><strong>Client</strong></p><ul><li>Fixed a client crash in the particle system while effects were being updated</li><li>Resolved a client crash while the game was checking the shape of a world object against its bounding volume</li><li>Fixed a client crash while converting a vehicle component record to a more specific type that did not match</li><li>Fixed a client crash while freeing memory</li><li>Resolved a client crash when using two tractor beams at once on a Vulture</li><li>Fixed a client crash while streaming a texture that was being rendered to at the same time</li><li>Resolved a client crash while building the list of objects a physics query should ignore</li><li>Corrected a fatal error raised when a ship registered two parts under the same identifier</li></ul><h4><br></h4><h2><br></h2><h2>Bug Fixes</h2><p>Alpha 4.10.3 closes 129 issues, including multiple exploits. Outside the new content the focus is on the things you touch every session: ASOP terminals and hangars, cargo and contracts, freight elevators, and the vehicle HUD.</p><p><strong>36 of these came to us through the Issue Council</strong>, and each one carries a link to the original report. Where the cause is worth knowing, the fix carries a short note under it explaining what was going wrong and what changed. Reports filed on the Issue Council, along with the confirmations and repro steps added to existing ones, are what let us reproduce an issue reliably and rank it against everything else. Thank you to everyone who takes the time to do it.</p><h3><br></h3><h3>Hangars &amp; ASOP Terminals</h3><p>A large concentrated pass on the hangar and fleet management loop has been done for 4.10.3. This covers 14 fixes directly related to Hangar and ASOP flow, eight of them raised through the Issue Council.</p><ul><li>Fixed an issue where the Retrieve button on an ASOP terminal could become greyed out, leaving you unable to retrieve, store or deliver the selected vehicle <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-214984\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-214984</a><ul><li>The hangar platform tracks its own position by listening for door events, and if one of those events was lost it sat in a moving state forever, which kept you on the controller's changing ships list and locked the terminal. The platform now checks itself against the doors, replays the missing event, and releases any pending store or retrieve if it cannot.</li></ul></li><li>Corrected an issue where many vehicles showed placeholder text for their status in the Fleet Manager and on ASOP terminals and could not be selected <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-223081\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-223081</a><ul><li>The vehicle list unloads rows as they scroll out of view, and a row returning to view still held the cached values from before it was unloaded, which is what surfaced as placeholder text in the status, cargo and crew fields; that cache is now cleared.</li></ul></li><li>Fixed a case where a ship left on an instanced hangar pad would not be stowed when the player left the landing location <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-222180\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-222180</a><ul><li>Stowing a hangar also stows whatever is sitting on the pad, but that nested request left out the piece of configuration that lets your location storage be created on demand, so it failed for anyone who had never stored anything there; it now includes it.</li></ul></li><li>Fixed an issue where impounded ships and the option to pay off their impound fine were not shown on ASOP terminals <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-205713\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-205713</a><ul><li>The terminal's impound check returned false even for impounded vehicles, so the entry appeared with the ordinary claim option and the fine never showed; that state is now reported correctly and the fine can be paid.</li></ul></li><li>Fixed an issue where retrieving a ground vehicle could cause it to be destroyed on the hangar pad <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-219816\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-219816</a><ul><li>Releasing a vehicle from the hangar lift could leave it displaced from its set-down spot, or give it enormous velocity on a stationary pad, driving it through the platform; a guard now restores the release pose and stops it dead.</li></ul></li><li>Corrected an issue where ships retrieved from an ASOP terminal lobby could clip into the hangar loading platform <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-137501\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-137501</a><ul><li>A retrieved ship was placed onto the hangar platform while it was still lowered and did not rise with it, so it ended up embedded in the pad, mostly on the first retrieval of a session; placement has been corrected.</li></ul></li><li>Corrected an issue where the MISC Prospector could be tilted over to one side when retrieved in a hangar <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-208824\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-208824</a><ul><li>The landing gear hardpoints sat at different heights, so one leg met the pad before the others and the hull settled at an angle, most often in the smallest hangars; the layout has been corrected so every leg sits level.</li></ul></li><li>Resolved an issue where a rented ground vehicle that had been scrapped or destroyed could not be claimed again<ul><li>Ground vehicles and power suits were not listed in the global item recovery rules that decide what can be insured and reclaimed, which covered spaceships only; both have been added, so an Ursa or an ATLS now behaves like a ship when you claim it.</li></ul></li><li>Fixed an issue where engine effects were already running on some vehicles as soon as they were retrieved <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-191084\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-191084</a><ul><li>Switching a ship's power on also switched on its engines, which was never intended, so a ship stored while powered came back with engines already running; engine activation is now separate and happens when you set the ship flight ready.</li></ul></li><li>Fixed an issue where hangars could visually overlap, letting players see into neighbouring hangars and the vehicles in them<ul><li>Spawning into your own hangar skipped the step that limits who the interior streams to, and left the door registered as an open doorway between zones while it was shut, so other instances at that gateway stayed visible; both are now set on spawn.</li></ul></li><li>Fixed a second case where players could see other players' vehicles from inside their own instanced hangar</li><li>Resolved an issue where opening an ASOP terminal froze the game for several seconds<ul><li>The terminal built interface elements for every vehicle you own at once instead of only the rows on screen, over ten thousand of them on a large fleet, stalling rendering for several seconds; only the visible rows are built now.</li></ul></li><li>Resolved an issue where dialogue and sound effects were missing when interacting with the ASOP terminal inside a personal hangar</li><li>Corrected an issue where hangars in landing zones added excessive reverb and echo to personal weapon sounds</li></ul><h3><br></h3><h3>Missions</h3><ul><li>Fixed an issue where using autoland did not complete the landing objective in the third part of the new player tutorial<ul><li>The objective never completed after autoland because it checked whether you were registered in the station's action area, which autoland did not satisfy, so it now tests whether the player is inside the landing location itself.</li></ul></li><li>Resolved an issue where a Nyx story mission could not progress past the objective to travel to the Blinding Hope because the ship failed to spawn<ul><li>The search for the vessel to place at the rendezvous filtered on a content tag that did not exist in this build, so nothing matched and the ship was never created; that filter has been removed.</li></ul></li><li>Fixed a case where the pick-up marker for delivery missions at Levski was placed inside the asteroid<ul><li>When no suitable container could be resolved, the system fell back to any container under that location, including instanced interiors with no real world position, which at Levski put the marker inside the asteroid. That fallback has been removed.</li></ul></li><li>Fixed an issue where a cargo loading area could stay permanently occupied and block every ship that used it afterwards<ul><li>A loading area records the vehicle using it, and if that pilot left the game before the transfer finished the record was never cleared, so the area stayed occupied and refused later ships; those stale records are now cleared.</li></ul></li><li>Resolved an issue where the Collector intro mission could not be found in the contract manager</li><li>Fixed an issue where accepting a mission card at Wikelo's would also accept other contracts at random<ul><li>The lookup behind accepting a mission card can return contracts beyond the one it asked for, and the old code accepted every result it was handed rather than just the one you picked; only the contract matching your request is accepted now.</li></ul></li><li>Corrected an issue where the progress counter for a Battaglia story objective stayed at zero after every hostile aboard the Blinding Hope had been killed <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-223490\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-223490</a><ul><li>The mission builds its hostile count by searching the boarded ship for enemies matching a target description, and this contract never supplied one, so nobody aboard was ever registered; that description is now set and the hostile ship spawn options have been corrected alongside it.</li></ul></li><li>Fixed a case where the vehicle to be salvaged for a Battaglia medium salvage contract would not spawn <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-218966\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-218966</a><ul><li>The fault was in the vehicle data rather than the contract: the Prospector template and the salvageable Prospector variant both carried incorrect tags, and both have been retagged so the right ship is placed at the site.</li></ul></li><li>Fixed an issue where mission objective text was cut short on the player HUD</li><li>Fixed an issue where ships spawned into a mission area at partial health would climb back to full shortly afterwards <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-220843\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-220843</a><ul><li>Spawning a ship with preset damage only translated that figure into actual damage for entities that track individual hit locations, and ships were not covered by that check, so nothing was ever really damaged; vehicles now run through the same path.</li></ul></li><li>Fixed an issue where hostile ships in Bounty Hunter and Mercenary missions would sometimes not return fire<ul><li>After finishing an intercept run, hostile pilots did not reliably return to standard combat flight mode, and in that state they would close with you but never fire, so the behaviour now switches back explicitly when the intercept completes.</li></ul></li><li>Resolved an issue where a large amount of extra cargo would appear in the freight elevator after completing a Recover Cargo contract<ul><li>Hand-in progress counted each container's volume rather than the container itself, so a few boxes registered as far more than you delivered and the surplus came back as a refund; progress now counts each container as one item.</li></ul></li><li>Resolved an issue where the contract list in the mobiGlas could become stuck and would not scroll through the available contracts <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-190800\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-190800</a><ul><li>The offer list had no interaction target of its own and the contract cards sat in front of it, so the mouse wheel was captured by the cards; the list now has its own target and sits nearer the camera.</li></ul></li><li>Fixed a case where there was no prompt to place an item into the dumbwaiter during an IASI mission<ul><li>The drop-off point on those lockers was exported at the model's origin rather than where it had been placed, so in game it sat buried inside the unit where nothing could reach it even though the setup looked right; the animations have been re-exported.</li></ul></li><li>Corrected an issue where only one player could hold a given PVP bounty contract at a time</li><li>Fixed an issue where the augmented reality marker for a mission location would disappear once the player was around 3km from the destination</li><li>Fixed a case where Gilly would not be present to greet the player after accepting the first Combat Gauntlet mission</li><li>Resolved an issue where some mission descriptions told players to travel to a derelict outpost while the objective was actually inside an underground bunker</li></ul><h3><br></h3><h3>Ships and Vehicles</h3><ul><li>Fixed an issue where placeholder spheres appeared in place of the weapon racks aboard some ships <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-223539\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-223539</a><ul><li>The racks sit inside prebuilt room containers on the affected ships rather than being assembled as the ship loads, and those containers had to be exported again for this release before the racks would come through with the rest of the room.</li></ul></li><li>Corrected an issue where the Drake Caterpillar's power plant could only be repaired from one narrow angle<ul><li>Collision belonging to the railing below the power plant extended up around the component itself, leaving only one narrow angle from which a tool or weapon could actually reach it; the collision in that corner has been reworked.</li></ul></li><li>Resolved an issue where players could get stuck on the power plant railings aboard the Drake Caterpillar, encountered during a Battaglia story mission<ul><li>Collision around the railings left a corner a character could step into and not get back out of; a barrier that only players collide with now seals it off, and the engine room's collision shapes were reworked in the same pass.</li></ul></li><li>Fixed a problem where landing gear springs provided no stiffness on vehicles with unusual leg layouts<ul><li>Load balancing across the legs measured each one along a fixed ship axis and pushed them all along a single averaged direction, so rotated or unevenly spaced legs received almost no force whatever their stiffness; each leg now uses its own orientation and spacing.</li></ul></li><li>Resolved an issue where ship components all used the same distortion resistance value instead of one appropriate to their size <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-221603\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-221603</a><ul><li>Several components, including the event reward coolers, power plants and radars, were left on a placeholder distortion resistance of ten, far weaker than their size allows, so ships fitted with them went offline almost immediately; correct values are now set.</li></ul></li><li>Fixed a problem where ships could skip being disabled and be destroyed outright when taking sustained continuous fire<ul><li>The extra health buffer that should leave a ship disabled rather than destroyed was not being drawn on under one unbroken stream of fire, so ships went straight from intact to wreckage; the destruction path now consumes it properly.</li></ul></li><li>Fixed an issue where landing services requested through the mobiGlas could become stuck showing a processing or blocked prompt <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-211549\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-211549</a><ul><li>When the server had no authority over your wallet, a mobiGlas purchase failed before the request was recorded as pending, so the shop was never told and the stale entry blocked later requests; the request is now recorded first.</li></ul></li><li>Fixed an issue where a vehicle that had been vented to a planet's atmosphere would not correctly restore its internal atmosphere, leaving players inside to suffocate or take damage from the cold <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-210719\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-210719</a><ul><li>A vehicle vented on a cold planet refills with gas at the outside temperature, and life support reheated it far more slowly than it added warm gas, so occupants suffocated or took cold damage; those values have been rebalanced.</li></ul></li><li>Fixed a problem where a ship's life support could report a level far above 100 percent <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-205396\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-205396</a><ul><li>The engineering readout compares life support's load with its rating, and reheating cold gas cost far more than adding warm gas, so the system was driven past that rating and reported up to 200 percent; the values have been rebalanced.</li></ul></li><li>Fixed an issue where players were unable to change the default power distribution on a vehicle <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-204538\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-204538</a><ul><li>Every ship started with the same fixed power distribution, so vehicles carrying tractor beams, mining lasers or salvage heads powered up with those systems off and players had to redistribute pips themselves; defaults have been reset fleetwide.</li></ul></li><li>Fixed an issue where the Esperia Prowler Utility was missing its cockpit controller, leaving the pilot unable to use ship systems <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-223485\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-223485</a><ul><li>The data file defining the ship's cockpit dashboard was never added to the build's asset inclusion list, so it did not ship with the vehicle and the cockpit had no controls to load; that file is now included.</li></ul></li><li>Fixed a case where the vehicle HUD would display as placeholder or dark grey textures <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-222692\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-222692</a><ul><li>The material that the vehicle augmented reality interface draws itself with was missing from the build's asset inclusion list, so the game had nothing to load for it and fell back to its placeholder texture; the material is now included.</li></ul></li><li>Corrected an issue where the aiming pip on the IFR-BC7 turret would lag behind moving targets while gimbals were enabled <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-193582\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-193582</a><ul><li>The turret's gimbal mount was built without the yaw and pitch pivots the aiming system drives, so the guns never swivelled even though gimbal mode engaged, and only moving targets revealed it; those pivots have been added.</li></ul></li><li>Resolved an issue where the targeting pip would vanish when a turret was aimed high <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-182133\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-182133</a><ul><li>The material drawing the turret's targeting shapes faded them out almost completely once they were viewed at a sharp angle; those elements now use a material that stays visible across a much wider range of viewing angles.</li></ul></li><li>Fixed a case where Stalker V CS missiles tracked so strongly that they could not be thrown off with countermeasures once they had locked on</li><li>Resolved an issue where a ship with a destroyed power plant could not be salvaged because it was still reported as powered on <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-220786\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-220786</a><ul><li>The structural salvage check asked whether any power plant was switched on rather than whether it was still functional, so a plant that had been destroyed but was still flagged as online kept counting; the check now tests for a working plant.</li></ul></li><li>Fixed an issue where the VTOL thrusters on the Esperia Prowler Utility did not rotate into position when VTOL was activated <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-171832\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-171832</a><ul><li>The VTOL thruster movement on this variant was driven by animation data that had not been exported correctly, so the nozzles stayed parked whatever the flight system asked for; the landing gear and VTOL animations have been re-exported and corrected.</li></ul></li><li>Resolved an issue where docking a snub to its host ship could produce a grinding sound <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-221546\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-221546</a><ul><li>The docking sound had no cap on how many copies of it could play at once, so repeated triggers stacked overlapping instances on top of each other; a voice limit has now been added so only a controlled number play together.</li></ul></li><li>Fixed a case where the Constellation Phoenix elevator pistons clipped through the lift <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-221547\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-221547</a><ul><li>The Invictus paint scheme carried a redundant duplicate of the lift geometry, which meant applying that livery made the elevator swap over to the duplicate parts; the extra geometry has been removed from the paint.</li></ul></li><li>Corrected an issue where the lamp on the RSI Skylark was absent <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-222006\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-222006</a><ul><li>Two settings on the Skylark's material, refraction and light amplification, had been left switched off, which left the effect with nothing to render through; both have been re-enabled on the material.</li></ul></li><li>Resolved an issue where the Esperia Prowler Utility's configuration tab showed a raw text label instead of a name <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-196555\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-196555</a><ul><li>The attached part item category had never been given a display name of its own in the text library, so anything of that type fell through to showing its raw internal label; a proper name has been added and linked to the category.</li></ul></li><li>Fixed an issue where a wall in the cargo bay of the RSI Zeus Mk II ES would flicker or drop out depending on the angle it was viewed from <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-191780\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-191780</a><ul><li>The visibility volume covering the neighbouring corridor and the portal leading off it sat slightly too low against the surrounding geometry, which left the cargo bay wall uncovered from some angles; both have been raised.</li></ul></li><li>Corrected an issue where there was no bed logout point in the left room of the recreation area on the Constellation Phoenix, and where the right bed could be used for logout without the usual restrictions</li><li>Fixed a case where the player would inconsistently lean forwards after entering the lower turret on Constellation Gold Standard variants</li><li>Resolved an issue where damage mesh clipped into the crew area behind the port bunks on Constellation Gold Standard variants</li><li>Fixed an issue where audio for the cargo and personnel elevators on Constellation Gold Standard variants was missing or too quiet</li><li>Corrected an issue where the Aegis Idris-P was using the armor intended for the Idris-M</li><li>Fixed a problem where the top cover of the Aegis Gladius Dunlevy's fuel port was too glossy and did not match the color of the surrounding hull</li><li>Resolved an issue where textures would pop in on the windows of the Anvil Centurion</li><li>Fixed an issue where space braking and afterburner audio on the Crusader Intrepid was extremely loud</li><li>Corrected an issue where the external personal storage cubby on the RSI Skylark had no sound when closing</li><li>Fixed a case where Gatac missiles launched at the wrong angle and clipped through the hull</li><li>Resolved an issue where inner thought prompts were displayed sideways and were hard to read in the pilot, copilot and turret seats of Gatac ships</li><li>Fixed an issue where operator and display button labels in the pilot seat were cut off and did not fit their frames on the Aegis Redeemer and Gladius</li><li>Corrected an issue where the turret weapon highlight circles on the MFD self status page were too large</li><li>Fixed a case where multifunction displays washed out in direct sunlight, by adding dynamic brightness</li><li>Resolved an issue where the G-Safe annunciator used the same label as the landing gear annunciator</li><li>Fixed an issue where the Baler salvage head had no model in the 3D view of the engineering terminal</li><li>Corrected an issue where the room control panel in a ship's crew habitation could not open or close its door, though it could still work the lights</li><li>Corrected an issue where the Drake Golem played no audio alert while carrying unstable Quantanium</li><li>Resolved an issue where the TOAG Laser Repeater S3 made no sound when fired</li><li>Fixed an issue where the Size 4 Polaris shield carried the wrong name and description</li></ul><h3><br></h3><h3>Cargo, Shopping and Inventory</h3><ul><li>Fixed an issue where a purchase could fail and time out, blocking all further shop purchases<ul><li>A purchase was only recorded after the payment request was sent, so an instant rejection ran the failure path before any record existed. The record was then written and never cleared, blocking later purchases; the steps are now reordered.</li></ul></li><li>Fixed an issue where commodity purchases at kiosks would eventually start failing even though there was still space available on the ship's cargo grid <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-217642\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-217642</a><ul><li>The kiosk's figure for remaining ship capacity was not updated as purchases completed, so after several buys it no longer matched the cargo grid and transactions were refused; capacity is now reported in step with the grid.</li></ul></li><li>Fixed a case where cargo could be lost when a request to remove it from a Freight Elevator failed <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-219727\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-219727</a><ul><li>Taking cargo back off the elevator ran the mission order cleanup even when the request failed, and that cleanup could take the items with it, so a failed request cost you the cargo; it no longer runs on failure.</li></ul></li><li>Fixed an issue where vehicle modules could be pulled out through a Freight Elevator <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-181911\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-181911</a><ul><li>Vehicle modules were small enough in inventory terms for freight elevators to accept them, so they could be moved through a system never built to handle them and could be lost outright; module sizes have been increased past that limit.</li></ul></li><li>Fixed an issue where the stats of crafted items stored inside containers did not persist between patches <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-221433\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-221433</a><ul><li>When a container went into long term storage, the saved data holding a crafted item's rolled stats was attached only to items being moved at that moment, so anything already inside came back with default values; records now cover everything.</li></ul></li><li>Corrected an issue where the crafted TH-01 Propulsor had the wrong item size and took up far too little space in inventory<ul><li>The crafted version of the component was authored with a volume far smaller than the part it represents, so inventory checks barely counted it and hundreds fitted in one backpack; its size has been corrected.</li></ul></li><li>Corrected an issue where refinery processing methods displayed the wrong description text<ul><li>Each refining method's description was tied to its position in the list, and that list is not built in the same order every time, so the description rarely matched the method selected; the text now lives with the method's data.</li></ul></li><li>Fixed a problem where inventory kiosks did not always show the full contents of a player's inventory</li><li>Fixed an issue where the Yormandi Tongue took up almost no space when stored, despite being a large two handed carryable</li><li>Resolved an issue where the name of an item held in a tractor beam was cut short rather than wrapping</li><li>Fixed a case where the Store option on the interaction wheel did nothing for item cases</li><li>Corrected an issue where prices on the augmented reality shopping cards of displayed items appeared offset or broken from some angles</li><li>Fixed an issue where the side stand on the Constellation Phoenix commemorative display disappeared when viewed from certain distances</li><li>Resolved an issue where the bottom section of the RSI Venture Executive armor display had no collision</li><li>Corrected an issue where no variant of the MaxLift tractor beam or the Cambio SRT could be placed on the Bosco weapon display rack</li><li>Fixed an issue where the ship on the Aurora Mk II and RSI Constellation Mk IV Andromeda display models cast no shadow while the stand beneath it did</li><li>Fixed a case where the RSI Constellation Mk IV Andromeda model floated in mid air when snapped to a freight elevator or ship cargo grid</li></ul><h3><br></h3><h3>FPS, Weapons and Armor</h3><ul><li>Resolved an issue where Monolith helmets would visibly change shading as the camera moved closer or further away, across every variant</li><li>Fixed an issue where some undersuits clipped through the arms of the Monolith Runic heavy armor</li><li>Corrected an issue where the material around the shoulder and armpit of the Monolith heavy armor looked low resolution and distorted while holding a weapon</li><li>Fixed an issue where a stray spinning object could be seen when charging or firing the Arrowhead sniper rifle and its variants</li><li>Fixed a case where the heavy helmet from the Orison relief armor sets used incorrect textures</li><li>Resolved an issue where the female character's left arm stretched and distorted while holding a long rifle</li><li>Corrected an issue where every variant of the Omarof optic carried the same name as the default</li><li>Fixed an issue where some utility items were significantly louder than the rest</li></ul><h3><br></h3><h3>UI and Text</h3><ul><li>Fixed a problem where some eyebrow options appeared with a placeholder texture in the character customizer<ul><li>Several eyebrow options were listed in the customizer, but their materials and meshes were never brought into the 4.10 release, so the game had nothing to load and fell back to a missing asset texture; those assets are now included.</li></ul></li><li>Fixed an issue where a newly added friend did not appear in the friends list and could not be found by searching<ul><li>The game sent an out of date key when asking the Spectrum service about accounts, so every lookup was rejected; that key has been updated. Because the failure was at the lookup stage, adding someone through Spectrum directly still worked.</li></ul></li><li>Fixed an issue where the names shown for the Venture Starwalker and Infrared suits were swapped with each other</li></ul><h3><br></h3><h3>Locations and Environment</h3><ul><li>Fixed an issue where players approaching the Area18 starport were given a warning and then despawned<ul><li>The restricted areas around the city centre and its tower were two large spheres that reached into the spaceport approach, and the warning before despawn was fifteen seconds; they are now smaller merged boxes with a ninety second warning.</li></ul></li><li>Resolved an issue where air traffic control voice lines were not audible to the player<ul><li>Air traffic control audio plays on the controller's own sound object, which sat kilometres away and so fell outside the range where sound objects are kept alive, and the override meant to force it active never worked; both are fixed.</li><li>Fixed an issue where air traffic control could not be contacted to land at or leave Distribution Centers <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-220137\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-220137</a><ul><li>The affected depots shipped without any air traffic control set up in their final layout, so there was no controller to appear in your comms list or to answer a hail; the missing setup has been added.</li></ul></li><li>Fixed a case where rocks and scattered scenery appeared smeared into streaks <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-215562\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-215562</a><ul><li>Motion data for rocks and similar scattered scenery was never generated, because the instruction to produce it was being passed into the wrong place in the rendering code, leaving the image reconstruction pass with nothing to track those surfaces by; that is now corrected.</li></ul></li></ul></li><li>Corrected an issue where a door beside the coffee stand in the Area18 spaceport was missing <a href=\&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN/issues/STARC-201891\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;>STARC-201891</a></li><li>Resolved an issue where footsteps did not change to match the surface being walked on, and some foley sounds were missing entirely<ul><li>Audio objects are recycled, and a recycled one still carried the parameter values cached by its previous owner, so a request to set the surface material to a value that matched that stale cache was discarded as redundant; the cache is now emptied on reuse.</li></ul></li><li>Fixed an issue where some planet surface buildings on ArcCorp had no collision</li></ul><h3><br></h3><p><br></p><h3>Hotfixed in 4.10.2</h3><p>Between 4.10.2 going live and this release we shipped five hotfix builds to the live environment. Only the first of those included a client update, so most of what follows reached you without a download. Everything here is already in your hands and is listed for completeness rather than as new in 4.10.3.</p><ul><li>Fixed a server crash loop that was destabilising shards, caused by character heads spawning an eyebrow with no geometry that was then never cleaned up</li><li>Resolved an unhandled exception raised when a zone was deleted before it had finished emptying</li><li>Fixed a server crash while a player's mission log was being read at the end of a contract</li><li>Resolved a server crash in the mission refund path caused by a division by zero</li><li>Fixed a problem where ships could explode on contact with hangar doors, by making the collision damage suppression independent of server frame rate and guarding against ships desyncing inside hangars</li><li>Corrected an issue where the Retrieve button on an ASOP terminal could stay greyed out indefinitely, by adding a one minute failsafe that releases a vehicle stuck mid retrieval. The underlying cause is fixed properly in this release</li><li>Fixed an issue where reopening an ASOP terminal cleared the vehicle claim timer, and where a delivery time was shown while the delivery system was switched off</li><li>Resolved an issue where RSI Discovery Month scores did not add up correctly, because completion points on shared salvage and Quantanium mining contracts were not split between party members</li><li>Fixed a case where IASI Courier packages around Hurston spawned deep inside Distribution Centers, where collecting them flagged the player for trespassing</li><li>Corrected an issue where the game failed to start on newly released NVidia laptop hardware, and where HDR was offered on displays that could not support it rather than being shown as unavailable</li></ul><p><br></p>&quot;},&quot;type&quot;:&quot;article&quot;}]}}" v-cloak=""></g-platform-client-component><div id="aria-skin-info" data-orion-skin="generic.default.base-" style="position:absolute; top:0, left:0;"></div>
