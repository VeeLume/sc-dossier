ormation&quot;,&quot;subtitle&quot;:&quot;&quot;,&quot;contents&quot;:[&quot;<p>Characters in this new environment have been built from Long Term Persistence(LTP) data.</p><p>Currently with LTP, certain player states such as personal hangar layout, custom characters, in-progress refinery jobs, and in-game purchased consumables are not saved between releases which will cause some items to be lost in the update.</p><p><br></p><p><strong><u>Build Info</u></strong></p><p>This release is highly focused on the new Storm Breaker Activity, ASD Locations, New Ship Updates and Additions, and QoL Updates.</p><ul class=\&quot;html-list\&quot;><li>Long Term Persistence:&nbsp;<strong>Enabled</strong></li><li>Server Meshing: 5<strong>:5:600 Player Shards</strong></li><li>Starting aUEC:&nbsp;<strong>20,000</strong></li></ul>&quot;]}" arrangement="arrangementC" img-alt="" img-url="" v-cloak=""></g-introduction><div class="turbo-anchor" id="fab2a0e8" data-plugin_key="plugin_trblt_grid" data-position="4"></div><g-grid :cards="[{&quot;content&quot;:{&quot;title&quot;:&quot;Launcher 2.0 Update&quot;,&quot;summary&quot;:&quot;<p>Discover the newly updated RSI 2.0 Launcher! Showcasing a brand new look and several new features, the RSI experience has never been better. Click the image above to try it now!</p>&quot;,&quot;description&quot;:&quot;<p>Occupying: That's a word that hasn't been associated much with Vanduul Known locally as Pinecone, this Expansive Dwarf Planet is situated on the further edge of the green band and is often overlooked when compared to Nyx II</p>&quot;,&quot;simpleImage&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/df13403e9cd377b41596b6d1564e4337df5b88b0/resize(1663,1663,cover,crop(1663,1663,0,0,JvFFVmatwWHVAenhK68zvnrCa6cNkim6hiZGw3d15mkj3CxKfwSUzLJCFYMMTTwZ1AzeKM1AXkuXC2JLwmBJPqP7TfrQ9jEyhZdNGwPFmoXQdxTVGJYxUDc4uNyT5VHSvZuDTaCHmg))/starcitizen-rsi-launcher-thumbnail.jpg&quot;,&quot;tablet&quot;:&quot;/i/ac922779a74bde1e3dcf6c8f9bad673cb5151aef/ NThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ))/85/patch-4-0-webclip-jumppoints.webp&quot;,&quot;max&quot;:&quot;/i/ff49b53376e61ca50b88f6e29f47fc3c4c22b756/99pyU5Ga1kws2m4gSzxfoQwKvFgccWnK5JkSm22zVdhro2MQpdLwFt3JtwXyhd4H24JoBMgnt2SstX1zNThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ/patch-4-0-webclip-jumppoints.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Patch 4 0 Webclip JumpPoints&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div class="turbo-anchor" id="c91dae84" data-plugin_key="plugin_trblt_faq" data-position="7"></div><g-faq :background-options="{&quot;isTransparent&quot;:false}" :question-list="[{&quot;title&quot;:&quot;Gameplay : Storm Breaker - New Pyro ASD POIs - Radiation - New Wikelo Trades - Equipment Swapping&quot;,&quot;content&quot;:&quot;<h3><strong><u>New Persistent Sandbox Activity: Storm Breaker</u></strong></h3><p>Similar to the Align and Mine sandbox of Alpha 4.1, Alpha 4.2 brings with it a new series of persistent sandbox locations linked to the ongoing Regen Crisis narrative.</p><ul class=\&quot;html-list\&quot;><li><strong>ASD Data Centers</strong></li></ul><p>Located on Pyro 4, these facilities allow intrepid explorers to begin uncovering the lengths to which Associated Sciences &amp; Development have gone in combatting the current threat to humanity's ability to conquer death.</p><ul class=\&quot;html-list\&quot;><li><strong>ASD Shuttle Stations</strong></li></ul><p>Found on Pyro 1 at the outskirts of two enormous never-ending storms and deadly radiation zones, these stations allow visitors safer passage into the disturbances during their investigations within.</p><ul class=\&quot;html-list\&quot;><li><strong>ASD Research Facilities</strong></li></ul><p>Hidden in the dangerous confines of Pyro 1's deadly storms, intrepid players are encouraged to explore these supposedly abandoned facilities and uncover what ASD has worked so hard to keep secret. These facilities also have one-way freight elevators that allow players to send items from inside the Lazarus Facility out to the shuttle stations.</p><h3><br></h3><h3><strong><u>New Environmental Hazard: Radiation</u></strong></h3><p>Implementing dangerous radiation zones in specific locations, forcing players to adapt with specialized gear and strategic navigation. Player's may encounter full areas that have been irradiated, rooms that would be deadly to enter without proper gear, and items and fauna that are dangerous to hold or be near.</p><p>This update adds new Radiation accumulation, resistance, and falloff thresholds to player status effects. These effects will appear as new visual and player status cues with REMs on the HUD and can cause consequences resulting in player injury or death if not treated.</p><p>This update adds new player outfits with high radiation resistance as well as a base level of radiation resistance to all previous armor types.</p><p><br></p><h3><strong><u>Wikelo Emporium Exchange Updates</u></strong></h3><p>Adding multiple new ships and vehicles to the ever-expanding Wikelo's Emporium: Mirai Guardian QI, Anvil Mk2 Super Hornet, MISC Fortune, Aopoa Nox, Mirai Pulse, RSI Ursa Medivac.</p><p>These ships and vehicles, in addition to previously added ones, can be unlocked by bringing the NPC Wikelo a number of favors in exchange for rewards.</p><p><br></p><h3><strong><u>Equipment Swapping Hierarchy</u></strong></h3><p>Equipment swapping now has some hierarchy when swapping out gear using the new looting UI. This iteration will attempt to transfer items equipped on the <em>outside</em> of the player’s armor, such as weapons, grenades, medpens, and backpacks, to the newly equipped armor or undersuit. However, items stored <em>inside</em> the armor (e.g., internal storage or pockets) will not transfer.&nbsp;</p><p>When swapping gear, for example, looting an enemy’s armor, the system will first attempt to move all externally attached items from the old armor or undersuit to equivalent slots on the new one. If the new gear does not have enough attachment points, excess items should be placed into the player’s backpack. If there is not enough space in the backpack, the remaining items will be dropped on the ground.</p><p>This behavior is exclusive to the latest looting UI and not the old interface, so kiosks will continue to function as they did before.&nbsp;</p><p><br></p><h3><strong><u>Additional Gameplay Updates</u></strong></h3><ul class=\&quot;html-list\&quot;><li>All medbeds will now protect players from damage for a small amount of time after respawning. This effect will last 30 seconds while in the bed and will be canceled if getting out of bed before the 30 seconds are up.</li><li>Increased refinery job speeds across all types and updated to allow complete orders to be loaded onto cargo ships.</li><li>Reward Balance for Rayari Gathering Missions</li><li>Updated Bounty Hunters Guild missions to use the rebalanced encounters from Patrol Missions V1</li><li>Slightly increased the numbers of Kopion in Acidic Caves</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}},{&quot;title&quot;:&quot;Locations :  Exterior Proxy Polish Pass&quot;,&quot;content&quot;:&quot;<h3><strong><u>Location Updates</u></strong></h3><ul class=\&quot;html-list\&quot;><li>Exterior proxy polish pass to Space Stations and Landing Zone locations to reduce areas that can be used to clip into many of these locations from the outside</li><li>Added bigger cloud formations to Pyro IV</li><li>Increased Pyro IV temperatures</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}},{&quot;title&quot;:&quot;Characters & Ai :  New Hairstyles&quot;,&quot;content&quot;:&quot;<h3><strong><u>New Player Hairstyles</u></strong></h3><p>Added&nbsp;four new hairstyles to the character customizer, including 2 longer and 2 shorter styles.</p>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:false}},{&quot;title&quot;:&quot;Ships & Vehicles : ATLS IKTI - Prowler Utility - Flight Turbulence - New Scanning UI - Shield Regen&quot;,&quot;content&quot;:&quot;<h3><strong><u>New Vehicles: ARGO ATLS IKTI, GEO IKTI, and IKTI RAD</u></strong></h3><p>These new ATLS combat and mining variants are found in game through various means.</p><p>The IKTI and GEO IKTI are a new trade deal from Wikelo for various components.</p><p>The IKTI RAD is exclusively found at the new ASD Facilities in Pyro.</p><p><br></p><h3><u>New Vehicle: Esperia Prowler Utility</u></h3><p>Introduction of Esperia's newest stealth hauler. The Prowler Utility's 32 SCU cargo hold is easily managed with an integrated tractor beam, matching practicality with visual flair.</p><p>With S4 pilot weapons, a dual S3 turret, and quad S2 shields, the Prowler Utility provides the tools you need to safeguard your payload and safely reach your destination.&nbsp;</p><p><br></p><h3><u>Scanning Mode and Targeting UI Updates</u></h3><p>The Scanning Mode UI has been updated with further visual improvements. Lowered the required base emission to scan for a ship pilot's name from 80% to 10%, allowing you to identify a player's name more quickly and from farther away.</p><p>Additionally we have streamlined ship targeting markers:</p><ul class=\&quot;html-list\&quot;><li>Limit the number of non priority chevrons to 5&nbsp;<ul><li>Example: Neutral targets</li></ul></li><li>Targets show as chevrons until you Target or Pin them</li><li>Scan wave reveals all valid targets with their names and distances</li></ul><p><br></p><h3><strong><u>Shield Regen Updates</u></strong></h3><p>Updates to Shields to reserve buffer per-face instead of as one pool</p><p>Currently, the reserve pool stores all shield health in one pool, then distributes evenly back again. This can lead to easy distribution of health between faces again, e.g. if one face of four is fully down then the reserve pool will store 3/4 the health then distribute it evenly to all faces again. With this update, shields will now store each face separately in the reserve pool to avoid this redistribution.</p><p>Each reserve face stores a % of the current faces health, and regen up to a % of the max face health.&nbsp;When going from faces to reserve, regeneration won't start the reserve until the face is fully empty. When going from reserve to faces, only ignore regen delay for regen coming from the pool - still get the delay for normal regen (it’s currently ignored for both).</p><h3><br></h3><p><br></p><h3><strong><u>Prowler Series Updates</u></strong></h3><p>With the release of the newly added Prowler Utility, many balance changes have been made to the base Prowler to bring it more inline with its intended role in the universe.</p><ul class=\&quot;html-list\&quot;><li>Reduced Esperia Prowler Series Cross Section Values by over 50%</li><li>We've made moderate health, damage reduction, and Critical Damage Threshold Increases</li><li>Wing and Joint Health has been increased to further reduce them being broken off</li><li>Lesser Torque Imbalance Multiplier</li><li>Small increase to Quantum fuel amount</li></ul><p><br></p><h3><strong><u>Idris Series Updates</u></strong></h3><ul class=\&quot;html-list\&quot;><li>Greatly increased Idris Series capacitor ammunition</li><li>Increased turret rotation speeds while adding rotation acceleration and deceleration times</li><li>Increased Idris alpha damage to meet S7 damage weapon standards 2306 to 6750</li><li>Greatly increased hangar door and ramp health</li><li>Added missing gimbals on turrets</li><li>Retuned remote turrets traversal speed.</li></ul><p><br></p><h3><strong><u>Starlancer Series Updates</u></strong></h3><ul class=\&quot;html-list\&quot;><li><strong>Starlancer Series:</strong> Moderate Starlancer series SCM/NAV/Boost max speed increases. Reduced light range on ramp and drop door projectors</li><li><strong>Starlancer TAC:</strong> Updated hydrogen tanks to 48 SCU and quantum fuel tanks to 3.35 SCU. Weapon/turrets ammo max count buffed. Side turret max speeds reduced with added acceleration and decelerations times</li></ul><p><br></p><h3><strong><u>Missile and Torpedo Balance Updates</u></strong></h3><p>Across the board, missiles and torpedoes have been readjusted to increase minimum lock ranges and lock timers, added a minimum activation distance for fired torpedoes (~1500m), decreased min/max explosion radius on hit, and increased health.</p><ul class=\&quot;html-list\&quot;><li>Greatly Improved Torpedo Tracking Capabilities</li><li>Explosive Ordinances Will Now explode when Distorted and the Safety is off</li></ul><p><br></p><h3><strong><u>Ground Vehicle Scanning Adjustments</u></strong></h3><p>Set ground vehicle driver to be same baseline (0.1) as a ship pilot. Standardized scan baselines to signal quality range requirements for ships and ground vehicles scan information:</p><ul class=\&quot;html-list\&quot;><li>0, 0.1 - poor signal</li><li>0.5 - medium signal</li><li>0.76 - good signal</li></ul><p><br></p><h3><strong><u>Additional Ship &amp; Vehicle Updates</u></strong></h3><ul class=\&quot;html-list\&quot;><li>Flight turbulence has been readded to ships. This will be most noticeable in storms and when near ground surfaces where proximity flight disturbances occur</li><li>Added Flight Blade controllers and Behring CST-313 Castillo bomb rack to PU shops</li><li>Updated all 300 series loadout kits to use 1:1 gimbal size setup to match current game design as originals used size down gimbals</li><li>Increased ship soft death ratio. This will cause ships to enter soft death at a higher health pool.</li><li>Updated all engineering component's health scaling with increases and decreases across components</li><li>Swapped Regen &amp; Slapdown balance for shield generators</li><li>ATLS Variants can now be called using the freight elevator in the hangar after delivering it to the location on the ASOP</li><li>Updated ship UI messaging to reflect the average distortion of the power plant(s) as a percentage</li><li>Enabled countermeasure actions while in scan mode</li><li>Added gimbals to ground vehicle remote turrets</li><li>Reduced the Anvil Asgard/Valkyrie cross-section emissions</li><li>Changed the Singe Cannons to be bespoke to the Banu Defender</li><li>Greatly increased Polaris and 890j hangar door and ramp health</li><li>Updated Gladiator to allow missile swapping</li><li>Slightly increased the Anvil Valkyrie and Asgard max ammo capacity</li><li>Increased Anvil Centurion max turret ammunitions</li><li>Slightly restricted the Polaris turret gimbal movement to avoid them clipping through the ship</li><li>Slight reduction in Gladius max pitch velocity</li><li>Added missing C8 Pisces armor damage reduction modifier</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}},{&quot;title&quot;:&quot;Weapons & Items : VOLT Shotgun - CureLife DeconPen Xtra &quot;,&quot;content&quot;:&quot;<h3><strong><u>Volt \&quot;Prism\&quot; Shotgun</u></strong></h3><p>A revolution in tactical firepower. Starting as a high-impact, close-range weapon, this adaptive weapon evolves as you fire, building heat and transforming into a precision slug shotgun capable of punishing enemies at a distance with terrifying force.</p><p>Operators must monitor heat buildup carefully. Sustained fire can lead to overheating, reducing efficiency and leaving you exposed. Environmental factors play a crucial role, and atmospheric temperatures will affect heat generation, meaning your battlefield tactics must adjust with your surroundings.</p><p><br></p><h3><strong><u>New CureLife DeconPen Xtra</u></strong></h3><p>Delivers a rapid injection of both Canoiodide and Hemozal to not only treat radiation exposure but also improve a patient’s overall vitals, getting patients stabilized faster than ever.</p><p><br></p><h3><strong><u>R97 Shotgun Balance</u></strong></h3><ul class=\&quot;html-list\&quot;><li>Decreased pellets per shot from 12 - 8</li><li>Increased damage from 3.66 to 4</li><li>Decreased ADS spread modifier from 0.66 to 0.75</li><li>Increased min spread from 2 - 3</li><li>Max spread increased from 5.85 to 6.5</li><li>Increased yaw recoil from 0.3 to 0.45</li></ul><p><br></p><p><br></p><h3><strong><u>Additional Weapon Updates</u></strong></h3><ul class=\&quot;html-list\&quot;><li>Volt Shotgun Mag added to shops</li><li>Environmental suit added to shops</li><li>Adjusted Volt Weapon series modifiers to improve hipfire recoil feel</li><li>Updated all environment suit tolerances to approximately -150c to 175c</li><li>Added a base radiation resistance to all armors</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}},{&quot;title&quot;:&quot;Core Tech :  Dynamic Rain - LTP Additions - Performance Improvements&quot;,&quot;content&quot;:&quot;<h3><strong><u>Dynamic Rain</u></strong></h3><p>Adding dynamic rain in specific locations around both Stanton and Pyro, as a first step toward Genesis: Dynamic Weather. This includes rain and cloud formations, lightning, new audio updates, and water pooling and character/clothing texture shaders for more atmospheric experiences at planetary locations such as Hurston, ArcCorp, Bloom, and many other moons and planets around Stanton and Pyro.</p><p><br></p><h3><strong><u>LTP Additions</u></strong></h3><p>Added flight blades and bomb rack item types to LTP Records</p><p>Added fauna harvestables to LTP Records post 4.2:</p><ul class=\&quot;html-list\&quot;><li>Kopion Horn / Irradiated Horn</li><li>Marok Gem</li><li>Ranta Dung</li><li>Amioshi Plague</li><li>Irradiated Valakkar Fang (Adult/Juvenile/Apex)</li><li>Valakkar Skin / Chitin</li></ul><p><br></p><h3><strong><u>Additional Core Tech</u></strong></h3><ul class=\&quot;html-list\&quot;><li>Tech update to add ability for locked doors to require multiple forms of authentication to open such as having to wear specific clothing, armors, or helmets. This tech is currently used at the new ASD locations in Pyro.</li><li>Routed Item Recovery item spawns through the player's home inventory if the target medbed doesn't have a valid Landing Zone. This will be a buffer zone for items to be stored in the player's home location to add additional levels of reliability for when the player's spawn point no longer exists.</li><li>Refactored of how we handle cleanup/lifetime of entities spawned by mission location modules to allow better handling after DGS crash recovery</li><li>New Spawn Closet subsumption logic to pause and reset auto spawn tasks. This will help limit locations to the amount of FPS AI we set for the area.</li><li>Slightly reduced water light reflections to be less intense due to intense flashing</li><li>Terrain Physicalization performance optimizations</li><li>Area18 traffic CPU to GPU performance conversion update</li><li>Further 3d comms call visual polish pass</li><li>Made various client and server performance improvements</li><li>Made various networking improvements</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}}]"></g-faq><div class="turbo-anchor" id="77f903ad" data-plugin_key="plugin_trblt_rawmarkup" data-position="8"></div><br>

H2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;mobile&quot;:&quot;/i/a3d47d4ce494391bf2a6529cb58299946d43f834/resize(4,57,cover,crop(925,1646,0,1457,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE))/75/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;max&quot;:&quot;/i/597b95c2c37505d8adff59fde6f6478bee866ee1/2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ25D8pUgF8H1iMgGANafGm9Maus2KvUhgxZW9xtdZPeE/star-citizen-coramor-2024-community-contest-4k.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Star Citizen Coramor 2024 Community Contest 4K&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div class="turbo-anchor" id="e18e183a" data-plugin_key="plugin_trblt_faq" data-position="10"></div><g-faq :background-options="{&quot;isTransparent&quot;:false}" :question-list="[{&quot;title&quot;:&quot;Bug Fixes&quot;,&quot;content&quot;:&quot;<p><strong>SC Alpha 4.2 contains just over 190 bugfixes for issues occurring in 4.1.1, 64 of which originated from the Issue Council</strong></p><ul class=\&quot;html-list\&quot;><li>Fixed an issue causing players to receive an \&quot;We are unable to deal with your request at this time\&quot; error when retrieving ships</li><li>Origin 300 Series customizations should now function</li><li>Heart monitor should no longer continuously beep and never stop after being revived</li><li>Cargo Containers should no longer be loaded into cargo grids offset</li><li>The Idris K laser should now deal correctly calculated damage</li><li>Refinery Orders should now be able to be loaded onto cargo ships</li><li>Fixed an issue causing the Advanced HUD to randomly go missing if a multitool is equipped to the player's hip</li><li>Vehicle Doors, Ramps, and Elevators should now be able to be closed after a breach and repair</li><li>Players who bed logout should now be able to locate and QT back to their ship</li><li>Players should no longer see many duplicate PVP bounties for the same player</li><li>The Idris rear ramp should no longer have much lower health than intended</li><li>The Idris Torpedo nose health should no longer be incorrectly low</li><li>The Idris_P Fuse should no longer be locked and broken</li><li>The Idris Series Turrets should no longer be missing gimbals</li><li>Wikelo ship components should now be able to be equipped in the Vehicle Manager</li><li>Fixed an issue causing VJoy and several PIPs to go missing on all remote turrets</li><li>The Idris Series should no have proper Exterior lighting</li><li>Fixed an issue causing the Idris series capacitor levels to be insufficient for its turrets</li><li>The Klescher Prison escape route fan should now properly stop spinning after entering the code</li><li>The Idris-T Turret damage should no longer be incorrectly low</li><li>The Ace Pilot ship destructions should no longer cause the pilot body to be destroyed along with it</li><li>Fixed excess framerate drops while near the Pyro jump point station in Stanton</li><li>Internal Ship Components should now be able to be placed back into the component bays after removing them using a tractor beam</li><li>Fixed an issue causing players not to be able to re-dock their snub ship back to the Constellation Series</li><li>The Executive Hangar death zone should no longer remain present after all comp boards have been inserted</li><li>The Esperia Prowler should no longer be missing its two shield generators in the Vehicle Loadout Manager</li><li>Ruin Station Hangars should no longer have secondary doors that block players from exiting them</li><li>Fixed an issue causing the Contested Zone freight elevator to display an Internal Error when attempting to move items to the warehouse</li><li>The Polaris should no longer shoot down its own torpedoes with its PDC turrets</li><li>The Target MFD should now correctly show the distance and velocity of targets</li><li>Fixed an issue causing the Area18 restricted flight zone to go missing</li><li>The Starlancer TAC Capacitors should no longer be lower in its turrets</li><li>PVP Bounty Missions should no longer be active and appear after the target player has been arrested or logged out</li><li>Players should no longer click through their mobiGlas onto their ship MFDs while sitting in the cockpit</li><li>The Freelancer MIS should no longer be missing its missiles</li><li>Nested vehicles should no longer despawn after traveling away from the hangar</li><li>Players should no longer fall out of the habitation area of the ARGO RAFT during Quantum Travel</li><li>Players should now be able to fill freight elevators to full capacity with commodity crates</li><li>Fixed an issue causing the Crossroads of Crime Arena Commander map to be missing its main light source</li><li>Fixed an issue causing many elevator panels to go grey and not be interactable</li><li>Wikelo's DCP Armor sets should no longer be missing and should correctly be given as a reward when completing the respective missions</li><li>Fixed an issue causing many AI around the PU to jitter and walk in place</li><li>Players should now correctly be able to tractor beam cargo off of the Drake Caterpillar cargo grid while in EVA outside the ship</li><li>The Esperia Prowler HUD and MFDs should now correctly update when scanning</li><li>NAV Mode should no longer be accessible in snub vehicles by storing and retrieving them</li><li>The Ursa Rover variants should no longer be missing audio on opening and closing the ramps and doors</li><li>Fixed an issue causing many previous mission markers to remain visible throughout the NPE tutorial mission</li><li>The Dynamic Crosshair should no longer be missing from DCP Helmets</li><li>Kopion Kill Counter should now correctly appear and update after the player arrives at the marked mission caves</li><li>The MISC Starlancer Series liveries should now have correct text names</li><li>Fixed an issue causing PVP contracts to fail when the target player switches authority zones in the PU</li><li>Fixed an issue causing HUD objectives to periodically appear and disappear during gameplay</li><li>Fixed an issue causing vehicle power to not be assignable to weapons until they are disabled and re-enabled</li><li>Aphorite ore display should now correctly have texture in the refinery shop</li><li>Players and AI should no longer be able to shoot through glass windows</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:false}},{&quot;title&quot;:&quot;Technical Updates &quot;,&quot;content&quot;:&quot;<ul class=\&quot;html-list\&quot;><li>Fixed 5 Client Crashes</li><li>Fixed 8 Server Crashes</li><li>Fixed a Hybrid-Service Crash</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:false}}]"></g-faq><div class="turbo-anchor" id="c0794a69" data-plugin_key="plugin_trblt_rawmarkup" data-position="11"></div><br>

destarcitizen-thumbnail-devdiary-servermeshing-only.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;InsideStarCitizen Thumbnail DevDiary ServerMeshing ONLY&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="full-width" v-cloak=""></g-banner-advanced><div class="turbo-anchor" id="2459424b" data-plugin_key="plugin_trblt_narrative" data-position="13"></div><g-narrative-group :background-options="{&quot;isTransparent&quot;:false}" v-cloak=""><g-article :show-emphasis="false" body="<p>Here are a few of the latest known issues. For a more comprehensive list of Known issues and Workarounds, please check out our Knowledge Base here!</p><p><a href=&quot;https://support.robertsspaceindustries.com/hc/en-us/sections/360002667153-Known-Issues&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>https://support.robertsspaceindustries.com/hc/en-us/sections/360002667153-Known-Issues</a></p><ul class=&quot;html-list&quot;><li>PU - Pyro / Pyro IV - Eliminate All - Farro Data Center - AI / Mission Feature / Mission Content - Hostile AI are stuck inside spawn closets making the side mission impossible to complete (Hotfix Target)</li><li>PU - Pyro - Storm Breaker / Collector / Creatures / Mining - Irradiated Apex - Some Apex Valakkar limpets will vanish when they are successfully fractured</li><li>PU - Armor / UI / Personal Inventory - Items equipped and/or attached on the actor can't be dragged to be held by the actor's hands as its port will be missing</li><li>Multivehicle - PU / AC - Vehicles / Weapons / UI / VMA - Vehicle Weapons are not Interactable or Useable (Affects a handful of ships: Mirai Fury Series, Pulse, P-52, Spartan, and Cyclone Series)</li><li>PU - Vehicle - Naming ships, melting ships, or updating ship packages will delete any non-stock items that are fitted to the ship including paints</li><li>Multiitem - PU - Vehicle / Turret / MFD - Idris gimbals are empty and weapons/missiles are unable to be equipped to them (if turret is reequipped in the VLM)</li><li>PU - Pyro - Storm Breaker - Locations - Lazarus Research Complex - Freight Elevator - UI / Interactions - When placing items on the elevator floor then lowering it, the Freight Elevator will lose the items then raise itself (Moderate Chance)</li><li>ARGO ATLS ALL Variants - PU - Mount / Cargo Grid - Argo ATLS can be placed anywhere on the cargo grid without following the SCU grid pattern</li><li>PU - Pyro / Pyro I - Storm Breaker - Locations / Mission Feature / Physics - Bullets will not pass through the Shuttle Station's entrance curtain when firing outside</li><li>AEGS Idris-P - PU - Vehicles - Idris shields do not stop any laser weapons except panthers</li><li>PU - Freight Elevator / Contested Zones (CZ) - CZ Freight Elevator displays Internal Error when attempting to move items to the warehouse</li><li>Multivehicle - PU - Vehicles / Target lock - target lock is unlocked at random radar for targets is dropped</li><li>PU - Pyro - Courier - Mission Feature / Interactables - There is a chance that delivery packages cannot be placed on delivery shelves</li></ul><p><br></p>" v-cloak=""></g-article></g-narrative-group><div id="aria-skin-info" data-orion-skin="generic.default.base-" style="position:absolute; top:0, left:0;"></div>
