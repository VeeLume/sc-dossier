stion-list="[{&quot;title&quot;:&quot;4.8.2: Bugfixes & Technical&quot;,&quot;content&quot;:&quot;<p>Today's maintenance also includes work for characters being unstowed as well as fixing player characters that were previously stuck in a stowed state.</p><ul><li>Potential Fix: Issue where the active route would reset when switching between SCM and NAV modes on ships equipped with the Command Module</li><li>Potential Fix: Hangar doors would not open for the ship that needed to be escorted during Escort missions</li><li>Potential Fix: HPA and temperature levels would spike dramatically inside the Drake Ironclad and Command Module during navigation due to missing atmosphere simulation</li><li>Potential Fix: Actors wearing a helmet would still asphyxiate inside the Drake Command Module</li><li>Potential Fix: The Drake Ironclad Assault did not have sufficient VTOL thrust to take off from a landing pad while carrying cargo</li><li>Potential Fix: Actors could experience dangerously high HPA readings in certain areas of the Drake Ironclad after docking or undocking the Command Module</li><li>Potential Fix: The Argo MPUV had incorrect acceleration behavior caused by improperly rotated thrusters</li><li>Potential Fix: Players could not exit the Argo MPUV Tractor pilot seat using the Y hotkey or the PIT wheel</li><li>Potential Fix: The Mirai Guardian's radar was displaying incorrectly</li><li>Potential Fix: Thruster lights on the Esperia Prowler would reflect and flicker into the cockpit while hovering</li><li>Potential Fix: The Banu Defender's AlienWeek 2023 liveries (Harmony, Wanderer, and Ocellus) were not applying correctly</li><li>Potential Fix: Several doors on the hangar level of the TSG Idris Tranquility would appear open without player interaction</li><li>Potential Fix: ATC would default landing requests to docking ports instead of landing pads for ships that support both, at dual-support locations</li><li>Potential Fix: AI characters were stationary and unresponsive t-component><div class="turbo-anchor" id="f697e05d" data-plugin_key="plugin_trblt_faq" data-position="9"></div><g-faq :background-options="{&quot;isTransparent&quot;:false}" :show-expand-all-button="true" :expand-all="true" :question-list="[{&quot;title&quot;:&quot;Content & Feature Updates: Defend Location Missions&quot;,&quot;content&quot;:&quot;<h1><strong><u>New Mission: Defend Location - Ship Battles V3</u></strong></h1><p>Ship Battles V3 introduces the Defend Location archetype, a style of ship combat mission that has been a design goal since the original Ship Battles release. The premise is straightforward: a location is under attack and it is your job to stop it. Enemy bombers make coordinated strafing runs on fuel storage and other critical infrastructure, and your task is to intercept them before they can complete those runs. Let too many get through and the mission fails.</p><p>Alongside the core Defend mission, V3 also introduces a combined archetype that layers an escort objective on top of the defense. While you are shooting down bombers, a friendly ship is either launching from the station or inbound for landing, and hostile fighters are focusing on it. Both objectives are active at the same time. Completing both is required to succeed, and failing either ends the mission. This combined variant is the more demanding of the two and is designed to stress different ship classes, with interceptors and heavier fighters filling different parts of the engagement.</p><p>V3 also updates the existing Escort Ship archetype from V2 with Ace Pilot spawns and more varied escort ship flight paths, increasing the difficulty ceiling and reducing the predictability of those missions for players who have already run them extensively. Defend Location missions are available across asteroid mining bases in Stanton, Pyro, and Nyx at a wide range of difficulty tiers.</p><p><br></p><p><strong><u>Mission Details</u></strong></p><ul><li>Available at asteroid mining bases across Stanton and Pyro via Contract Manager</li><li>385 total mission locations across both systems, spanning 149 individual bases</li><li>Difficulty ranges from Very Easy through to Super tier (6 difficulty levels)</li><li>Missions will have reputation gates; Foxwell contracts additionally require completion of the Foxwell intro mission before becoming available</li><li>Abandoned and personal cooldown time of 15 minutes per mission</li></ul><p><br></p><p><strong><u>Rewards</u></strong></p><ul><li>Completing Defend Location contracts earns aUEC, Faction Reputation, and Scrip with the issuing organisation</li><li>Foxwell contracts pay Mercenary Scrip; Head Hunters contracts pay Council Scrip</li><li>Blueprint rewards are available at higher tier completions</li><li>No cost to accept any Defend Location contract</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:false}}]"></g-faq><div data-arrangement_key="fit-content-grid" class="turbo-anchor" id="57fe335e" data-plugin_key="plugin_trblt_banner_advanced" data-position="10"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:true,&quot;alignment&quot;:&quot;left-bottom&quot;,&quot;overlay&quot;:{&quot;displayed&quot;:true,&quot;opacity&quot;:0.75},&quot;logo&quot;:{&quot;displayed&quot;:false},&quot;box&quot;:{&quot;displayed&quot;:false},&quot;text&quot;:{&quot;displayed&quot;:true,&quot;overline&quot;:&quot;May 13th, 2026&quot;,&quot;title&quot;:&quot;Star Citizen Alpha 4.8 LIVE&quot;,&quot;subtitle&quot;:&quot;Tactical Strike&quot;,&quot;paragraph&quot;:&quot;&quot;},&quot;callToAction&quot;:{&quot;displayed&quot;:false},&quot;semanticTag&quot;:{&quot;title&quot;:&quot;h2&quot;,&quot;subtitle&quot;:&quot;h3&quot;}}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/ea0e9007c04d88a68d588fa99d72186646f8734a/resize(3000,1286,cover,crop(3840,1646,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKr 4JoBMgnt2SstX1zNThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ))/85/patch-4-0-webclip-jumppoints.webp&quot;,&quot;mobile&quot;:&quot;/i/271a36ba1f0db320c9ae49eebfea6c864efece77/resize(4,57,cover,crop(1096,1950,0,1344,99pyU5Ga1kws2m4gSzxfoQwKvFgccWnK5JkSm22zVdhro2MQpdLwFt3JtwXyhd4H24JoBMgnt2SstX1zNThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ))/85/patch-4-0-webclip-jumppoints.webp&quot;,&quot;max&quot;:&quot;/i/ff49b53376e61ca50b88f6e29f47fc3c4c22b756/99pyU5Ga1kws2m4gSzxfoQwKvFgccWnK5JkSm22zVdhro2MQpdLwFt3JtwXyhd4H24JoBMgnt2SstX1zNThhu5a9d5DmAhMvdBFG6CZMSECtTaibL8Gk2W3BVZf32HNoxJ/patch-4-0-webclip-jumppoints.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Patch 4 0 Webclip JumpPoints&quot;},&quot;video&quot;:{&quot;displayed&quot;:false}}}" layout="fit-content-grid" v-cloak=""></g-banner-advanced><div class="turbo-anchor" id="c91dae84" data-plugin_key="plugin_trblt_faq" data-position="16"></div><g-faq :background-options="{&quot;isTransparent&quot;:false}" :show-expand-all-button="true" :expand-all="true" :question-list="[{&quot;title&quot;:&quot;Gameplay: Tactical Strike Group - G-Forces & Flight Suits - Refueling Missions & Improvements&quot;,&quot;content&quot;:&quot;<h3><u>Tactical Strike Group (TSG)</u></h3><p>Tactical Strike Group is a new endgame verified mercenary contract designed for large, organized player squads. The mission tasks players with assaulting a fortified Nyx asteroid base held by hostile forces (QV Extraction Stations), working through a six-phase assault that demands tight coordination across ship classes and combat roles. The contract scales in intensity as each phase of the station is dismantled. The rewards will be great expect heavy resistance throughout.</p><p><br></p><p><strong><u>Mission Phases</u></strong></p><p><strong>// 01 - </strong>Approach and Defend Tranquility</p><p>Rally the strike force and escort the People's Alliance Idris&nbsp;Tranquility&nbsp;into position. The Idris will serve as your mobile rearm, repair, and refuel platform throughout the engagement. Establish perimeter defense before pushing on the station.</p><p><strong>// 02 - </strong>Destroy the Power Relays</p><p>Target the station's external Power Relays with&nbsp;<strong>ballistic weapons</strong>&nbsp;— energy weapons are ineffective against hardened station targets. Destroying all relays opens access to the superstructure trench runs.</p><p><strong>// 03 - </strong>Destroy Cooling Units</p><p>Cooling Units are vulnerable to&nbsp;<strong>energy weapons</strong>. Smaller ships must navigate the internal superstructure trenches to reach them, accumulating Distortion Damage the longer they remain inside.</p><p><strong>// 04 - </strong>Destroy the Core and Defend Tranquility</p><p>Breach the core chamber once the shutters open. Distortion and radiation intensity increases dramatically inside. Simultaneously, hostile forces will escalate attacks on Tranquility so<em> </em>exterior ships must maintain its defense.</p><p><strong>// 05 - </strong>Infiltrate and Override</p><p>With the core destroyed the station's interior FPS section becomes accessible. A ground team boards and fights through the station to reach the override terminal.</p><p><strong>// 06 - </strong>Escort Gabe to Safety</p><p>Extract hostage pilot Gabe Windell from Shattered Blade custody and get him safely off the station to complete the contract.</p><p><br></p><p><strong><u>Mission Overview</u></strong></p><ul><li>Available via&nbsp;Contract Manager in Nyx&nbsp;under Verified Mercenary Contracts</li><li>Designed for&nbsp;squads of 7 or more ships&nbsp;across multiple sizes and classes</li><li>Smaller ships are required to navigate the station's internal superstructure trenches</li><li>Larger ships support exterior combat and defend&nbsp;Tranquility&nbsp;throughout all phases</li><li>The People's Alliance Idris,&nbsp;Tranquility,&nbsp;provides on-site&nbsp;repair, rearm, and refuel&nbsp;for ships that fit in its hangar</li></ul><p><strong><u>Key Mechanics</u></strong></p><ul><li>Ballistic weapons&nbsp;deal damage to hardened station targets including Power Relays; energy weapons are ineffective on these components</li><li>Energy weapons&nbsp;are effective against Cooling Units and Core components</li><li>Ships accumulate&nbsp;Distortion Damage&nbsp;when flying inside the superstructure trenches and distortion intensity increases in the core central chamber once the shutter opens</li><li>Trench run entrances unlock when all Power Relays are destroyed; the FPS interior opens once the Core is down</li></ul><p><br></p><p><strong><u>QV Extraction Stations</u></strong></p><p>One of many kinds of stations abandoned across the Nyx system by QV Planetary Services, the QV Extraction Stations were once functional industrial operations left behind as the company cut its losses in the region. They have since found volatile new life as fortified strongholds. Derelict arms and corroded superstructure surround a hardened interior that now houses the faction's operations, and serves as the battleground for the Tactical Strike Group contract.</p><p><br></p><h3><u>G-Force Tolerances &amp; </u><strong><u>Flight Suits</u></strong></h3><p>What you wear in the cockpit now has a direct effect on how well your body handles the forces of high-performance flight. Flight suits are purpose-built for this environment and improve your g-force tolerance above the unequipped baseline, letting you sustain tighter maneuvers longer before blacking out. Combat armor works in the opposite direction: it is built for ground engagements and protection, not for sustained high-g flight, and will reduce your g-force tolerance accordingly. This change makes loadout decisions more meaningful for pilots and creates a clearer distinction between gear designed for flying and gear designed for fighting.</p><p>Many of the flight suits can be purchased with aUEC in game at locations such as Cubby Blast in Area18, Tammany and Sons in Lorville, Cordry's in Levski, Skutters in Grim HEX, and indy tradeposts in Pyro.</p><p><br></p><p><strong><u>What Has Changed</u></strong></p><ul><li>G-force tolerance is now dynamically calculated based on the clothing and armor worn by the player</li><li>Flight suits provide a positive g-force resistance modifier, improving your tolerance above the unequipped baseline</li><li>Combat armor applies a negative modifier, reducing g-force tolerance that increases in increments based on light, medium, heavy types and compared to flying unequipped</li><li>Undersuits also contribute to the total g-force resistance calculation and are factored into the final value</li><li>The modifier is distributed across the full armor set, so partial loadouts result in proportionally adjusted tolerance</li><li>Combat flight suits now provide 15% damage mitigation in addition to their g-force resistance bonus, giving pilots a defensive trade-off when choosing flight gear over combat armor</li><li>Arena Commander race modes now spawn players in the best available racing flight suit by default, ensuring competitive events start with optimal g-force configuration</li></ul><p><strong><u>Equipment Tolerance levels</u></strong></p><ul><li><strong>Higher Tolerances: Racing or Combat Flight Suit</strong></li></ul><p>Dedicated flight suits are optimized for high-g environments and provide the highest g-force tolerance available. Racing suits are tuned for sustained performance in competition; combat flight suits offer meaningful resistance alongside 15% damage mitigation.</p><ul><li><strong>Baseline: Unequipped (No Armor or Suit)</strong></li></ul><p>Flying without any armor or suit is the reference point for g-force tolerance. All modifiers are applied relative to this state. A player with no worn items experiences the default g-force resistance.</p><ul><li><strong>Reduced: Light or Medium Combat Armor</strong></li></ul><p>Lighter combat armor loadouts apply a moderate negative modifier to g-force tolerance. Pilots wearing partial or light armor sets will notice reduced resistance compared to flying unequipped, but the impact is less severe than full heavy armor.</p><ul><li><strong>Greatly Reduced: Full Heavy Combat Armor</strong></li></ul><p>A complete heavy armor loadout represents the lowest g-force tolerance in the system. Heavy armor provides maximum damage protection for ground combat but significantly reduces your ability to sustain high-g maneuvers in a cockpit. Plan your loadout accordingly.</p><p><br></p><p><br></p><h3><u>Refueling Missions &amp; Improvements</u></h3><p>Refueling content in 4.8 comes in multiple parts with new Refueling missions as well as Improvements to the overall refueling playability. The first is a new set of contracts from the United Wayfarers Club that give players who own refueling ships a dedicated mission type to engage with. The second part is a significant overhaul to how ship-to-ship refueling works at the system level, making the process faster, clearer, and less punishing.</p><p>With this update, there is a new operator mode on the refuelling ship to enable Refueling operator mode, just like salvage or mining mode. Players can enter the mode by pressing “M”. Entering the mode will automatically extend/retract the fuel nozzle allowing either party to send requests for docking to initiate the refueling process. Once docked, fuel transfer can be initiated through the Vehicle Maintenance App, just select the amount, confirm the purchase, and the fuel moves. For the fuel giver it changed however: As long as there are relevant pods open, the fuel flows automatically as soon as a purchase was made. Players can still manually control the flow: opening/closing pods and transfer fuel from one pod to another. Ten new fuel pods and nozzles are also being added, along with refueling beacons that let players in need of fuel broadcast a request to anyone in the area.</p><p><br></p><p><strong>// Part 1: Refueling Missions</strong></p><p><strong><u>Mission Overview</u></strong></p><ul><li>&nbsp;&nbsp;Refueling contracts are now available from the United Wayfarers Club via the Contract Manager</li><li>&nbsp;&nbsp;Contracts are specifically designed for pilots operating refueling ships such as the Starfarer</li><li>&nbsp;&nbsp;Payment is held in escrow during the refueling process and released on successful completion</li><li>&nbsp;&nbsp;AI ships involved in contracts are always passive and will never initiate docking; the player must send the docking request</li><li>There are Multi Ship Refuel missions where more than one ship in a given area is out of fuel and the player is sent to refuel them all</li><li>The base refueling missions have a ‘Difficulty Scale’ where players will be sent to refuel ships with larger fuel tanks</li><li>Added many blueprints for nozzles to refueling missions</li></ul><p><strong><u>Refueling Beacon (For Ships Out of Fuel)</u></strong></p><ul><li>&nbsp;&nbsp;Players who have run out of fuel can now submit a refueling beacon from their MobiGlas, specifying whether they need Hydrogen, Quantum Fuel, or both</li><li>Within a short period, an AI Starfarer will respond to the beacon and fly out to assist</li><li>&nbsp;&nbsp;A ship that is completely out of fuel cannot move, but autodocking does not require fuel, so the stranded player can still complete the connection</li></ul><p><strong><u>Available Contracts</u></strong></p><ul><li><strong>Refuel a Stranded Ship Contract</strong></li></ul><p>A ship has run out of fuel and is stationary at the marked location. Fly out, extend your refueling boom, dock to the vessel, and fill its tanks to complete the contract. The stranded AI ship will accept your docking request and QT away once refueled. Best suited for Starfarer-class ships with sufficient fuel pod capacity to fill a target tank from empty.</p><ul><li><strong>Receive Fuel from an AI Refueler Contract</strong></li></ul><p>An AI Starfarer will quantum travel to your position and offer to refuel your ship. Target the AI ship, press N to request docking, align to their nozzle, and confirm your fuel purchase in the Vehicle Maintenance App. Payment is taken from escrow once fuel transfer is complete and you undock. The AI ship will QT away after the exchange.</p><ul><li><strong>Distress Signal Ambush Variant</strong></li></ul><p>Not every distress beacon is genuine. Some contracts will lead you to a decoy satellite broadcasting a fake fuel request signal. Upon arrival, the mission provider will warn you something is wrong before hostile AI ships quantum in and attack. Eliminating the attackers earns a bonus reward above the base contract payout. Running from the engagement still completes the contract for the base amount. Hostile ship count is kept low given you will be flying a refueling vessel.</p><p><br></p><p><br></p><p><strong>// Part 2: Refueling System Improvements</strong></p><p><strong><u>Docking, Fuel Transfer, and New Items</u></strong></p><ul><li>&nbsp;&nbsp;Flow speed is now a fixed property of the nozzle and cannot be manually adjusted. Nozzles can no longer be damaged by incorrect flow speed settings</li><li>&nbsp;&nbsp;Hydrogen fuel is always delivered before Quantum Fuel when both are requested. Pods for both types can be opened at the same time without manual switching</li><li>&nbsp;&nbsp;10 new items are being added: 5 new fuel pods and 5 new nozzles, with existing items rebalanced. Pods and nozzles vary in flow speed, storage capacity, and damage resistance</li><li>Refueling pods have all had a large increase in how much fuel they can hold</li><li>&nbsp;&nbsp;Stats on the fuel nozzle and pods received a rework: Pods now add a modifier on the flow speed that is defined by the nozzle. And we have separate flow speed for QUA and HDY fuel</li><li>&nbsp;&nbsp;Refueling pods are now available for purchase at stations via the commodity shop</li></ul><p><strong><u>UI Changes</u></strong></p><ul><li>&nbsp;&nbsp;The pod management interface has been consolidated from two screens into one</li><li>&nbsp;&nbsp;Pod fill amounts are now displayed as a current/total value (for example, 450/600 SCU) rather than as a percentage</li><li>&nbsp;&nbsp;Valve control elements have been removed from the pod management screen</li><li>&nbsp;&nbsp;Payment information, process timeline, and an Abort button remain on screen during active refueling</li><li>&nbsp;&nbsp;A control hint for entering Refueling Mode now appears in the lower right of the HUD when seated in the pilot seat</li></ul><p><br></p><p><br></p><h3><strong><u>Additional Gameplay Updates</u></strong></h3><ul><li>Added many blueprints for refueling nozzles to refueling missions</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:false}},{&quot;title&quot;:&quot;Ships & Vehicles: Vehicle Loadout Recovery -  Drake Ironclad - Command Modules - Hammerhead GS - Ship Hangar Service\n&quot;,&quot;content&quot;:&quot;<h3><u>Item Recovery&nbsp;- Vehicle Loadouts</u></h3><p>Item Recovery for vehicles changes how ship claims work at a fundamental level. Previously, claiming a ship always returned the manufacturer default configuration, and any modifications you had made to it were simply gone. With this update, you can now save a snapshot of your ship's current loadout at the ASOP terminal. When your ship is destroyed and you file a claim, you will have a choice: claim the manufacturer default for free with a longer cooldown, or claim your saved insured loadout at an aUEC cost with a shorter cooldown. Your custom components and weapons can all be preserved through claims as long as you kept a snapshot up to date.</p><p>It is very important to remember to imprint your loadout before leaving the hangar!</p><p>Along with this update we have made other adjustments to the ASOP which include a limit of 25 ships delivered per location and a new Local ships only view to make sure you can quickly see what you have delivered. On the local ship view, you will be able to destroy a ship when needed.</p><p><strong><u>Key Concepts</u></strong></p><ul><li>Loadout Saving</li></ul><p>A record of your ship's current loadout saved at the ASOP terminal. Includes equipped components, ship weapons, locker contents, and poster decorations attached to wall slots. Ammo and missiles are excluded. Bricked items cannot be included.</p><ul><li>Registered</li></ul><p>An item that has been included in a snapshot and can be claimed back if lost.</p><ul><li>Insured Loadout Claim</li></ul><p>A claim that returns your ship in the state it was when you last took a snapshot. Costs aUEC based on the hull and the value of the saved configuration. Does not include ammo or missiles.</p><ul><li>Bricked</li></ul><p>When a registered item is claimed, the original copy enters a bricked state after a brief grace period and becomes non-functional. Bricked ships and items remain in your hangar and can be scrapped.</p><p><strong><u>How Claims Now Work</u></strong></p><ul><li>When filing a claim after a ship is destroyed, you now have two options at the ASOP terminal: claim the manufacturer loadout or claim your saved insured loadout</li><li>The manufacturer loadout claim is free and uses the default configuration from your RSI web hangar or the in-game default. It has a longer cooldown timer</li><li>The insured loadout claim returns your ship with all registered components and equipment in place. It costs aUEC based on the components saved to the loadout and has a shorter cooldown</li><li>Cooldown timers for insured claims begin when you spawn the ship, not when it is destroyed</li><li>The option to pay aUEC to reduce a standard claim timer has been removed as this is now part of the insured loadout</li><li>Ships claimed in either mode will brick any previously active copy of the same ship after a short grace period</li></ul><p><strong><u>Saving a Snapshot</u></strong></p><ul><li>Use the save icon on the ASOP terminal while your ship is retrieved to snapshot its current loadout</li><li>Snapshots include the ship's equipped components, weapons, and placed poster decorations</li><li>Taking a new snapshot replaces the previous one. Items no longer in the new snapshot lose their registered status unless they appear in another vehicle's snapshot</li><li>Nested vehicles (such as a fighter stored inside a larger ship) are included in the parent ship's snapshot if present when the snapshot is taken. Nested ships can also have their own independent snapshots</li><li>Stolen AI ships cannot be registered or included in a snapshot</li><li>A single registered item can appear in snapshots for multiple ships simultaneously</li></ul><p><strong><u>Consumables and Bricked Ships</u></strong></p><ul><li>Ammo and missiles are consumables and are not returned when claiming an insured loadout. You must restock and rearm via ship services after each claim</li><li>Fuses are restored to the state they were in when the snapshot was saved</li><li>Bricked ships are not automatically removed from hangar storage. You can call them up in your hangar to retrieve any cargo that was aboard before scrapping them</li><li>You can scrap a bricked ship from your hangar. Scrapped ships you own can still be claimed back later</li><li>Registered vehicle components cannot be used as turn-ins for mission rewards</li></ul><p><strong><u>Vehicle Manager App Changes</u></strong></p><ul><li>The Vehicle Manager App (VMA) no longer saves ship loadouts. Saving a loadout must now be done through the ASOP terminal</li><li>VMA is now limited to ship customization functions, similar to how tractor beam interactions work</li><li>VMA now only displays vehicles stored at the player's current location, regardless of who owns them</li><li>Ship customization applied via pledged vehicle packages now correctly applies through the new system</li><li>Nested vehicles are now correctly reflected as part of their parent ship's stored state in the ASOP terminal</li></ul><p><br></p><p><br></p><h3><u>New Ship: Drake Ironclad &amp; Ironclad Assault</u></h3><p>The Drake Ironclad lineup has now been introduced into the PU. These large logistics and combat platform ships are build around the use of Drake's Command Modules. Unlike conventional ships, the Ironclad cannot be piloted on its own. The included Drake Command Module must be docked and paired with the hull before flight control is available.</p><p><br></p><h3><strong><u>New Ship: Drake Command Module</u></strong></h3><p>The Command Module feature introduces a new ship pairing mechanic where a smaller, fully pilotable command ship takes control of a larger host ship that cannot fly on its own. For this 4.8.0 PTU, this applies to the Drake Caterpillar. Without a Command Module attached, the host Caterpillar cannot be piloted.</p><p>The core flow is: The Parasite docks to the Host and initiates a <strong>System Migration Procedure (SMP)</strong>, a brief transitional phase during which both ships are non-functional, after which the Parasite's pilot gains full control of the paired unit through the Host's systems. The process reverses cleanly on undocking.</p><p>Default docking has been moved to a new keybind to avoid collision with landing gear toggle: <strong>RALT+N</strong> for Ship-to-ship docking/undocking (preferred over ALT+N to keep ATC requests on tap ALT+N and for HOTAS usability).</p><p><strong><u>System Migration Procedure (SMP)</u></strong></p><p>The SMP is implemented as a new<strong> mode</strong> so it can apply ship-wide changes across UI, audio, and VFX simultaneously to both vehicles.</p><p>During SMP:</p><ul><li>All MFDs on both the Parasite and the Host display a dedicated transfer UI showing migration progress</li><li>No thrusters or weapons are operable on either ship</li><li>The command module cannot undock during this phase</li><li>Cockpit lights on the command module change color to indicate the transition state</li></ul><p>After SMP completes movement input controls both ships as a single unit. The Power Management MFD controls the Host's power allocation. Self-Status MFD and MFD Casts display the combined Command Module and Host instead of just the command module. All standard vehicle functionality is available: combat, QT, landing services, docking to ships and stations.</p><p><br></p><h3><u>Aegis Hammerhead - Gold Standard</u></h3><p>The Aegis Hammerhead has received its Gold Standard pass, bringing the ship's interior up to the level of quality established by more recently built and reworked vessels. Every area of the interior has been reviewed and polished from the crew quarters and cargo hold through to the turret cockpits, the captain's quarters, and the service areas below decks. The update also addresses a significant number of functional issues that have been present in the ship since its original release, including missing collision on several interior geometry pieces, visarea and atmosphere problems in the turrets, overloaded life support, and a collection of interaction and UI fixes across the cargo elevator, component bays, and power relay systems.</p><p><strong><u>Art &amp; Physical Changes</u></strong></p><ul><li>Interior art has been fully reworked and brought up to Gold Standard quality</li><li>Gravity Generator room added</li><li>A personal storage lockers have been added to the crew quarters</li><li>Floating lights in the empty component bay of the cargo room have been corrected</li><li>Geometry in the fire extinguisher housing has been fixed</li><li>Bridge sign assets that were missing from the ceiling have been restored</li><li>Bathroom doors that were floating slightly off the wall have been corrected</li><li>Multiple LOD issues have been resolved causing many doors and assets in the ship to lose textures or visibility at a distance</li></ul><p><strong><u>Technical &amp; Functional Changes</u></strong></p><ul><li>Radar has been increased to a size 3 radar</li><li>Component bay doors now open fully; previously they did not open completely</li><li>Component bay housings have been resized to correctly fit the components they contain</li><li>Collision has been added to the large component bays inside the cargo area, relay wall pieces throughout the ship, and areas in the captain’s quarters which previously had none</li><li>A collision box that was blocking the center of a main hallway has been removed</li><li>The cargo hold ladder is no longer blocked when the Grav Gen door is open</li><li>A visarea portal issue in the cargo elevator housing has been fixed</li><li>A door type present throughout the ship had a recurring visarea issue that has been corrected</li><li>The cargo elevator screen UI is no longer offset from its physical screen geometry</li><li>The right-side personnel elevators no longer clip out of the ship geometry when lowered</li><li>The top turret access door on the Gold Standard variant can now be opened correctly</li><li>Turret MFD UI screens are no longer offset from the physical screen position</li><li>Turret MFD interaction prompts were mirrored and have been corrected</li><li>The Power Relay in the cargo bay now has correct interaction prompts</li><li>Upper deck component bay interaction buttons now have a larger and more reliable hit detection area</li><li>Special weapon rack doors now correctly play their close animation</li><li>Audio no longer abruptly cuts or changes when moving between interior zones</li><li>Bed prompts now correctly show a log-out option; a false \&quot;Get Up\&quot; prompt when approaching beds before entering them has been removed</li></ul><p><strong><u>Systems &amp; Balance Changes</u></strong></p><ul><li>Life Support was severely overloaded on the Hammerhead. The load has been corrected to function within intended parameters</li><li>The front right turret cockpit previously had no breathable atmosphere. This has been resolved and the turret is now correctly pressurized</li><li>Turret cockpit canopies now have collision, closing a previously open issue that allowed boarding through turret access points</li></ul><p><br></p><p><br></p><h3><u>Ship Hangar Service</u></h3><p>Capital Ship Hangar Service brings the same repair, restock, and refuel services you use at landing zones directly onto large capital ships. When landed in the hangar of a supporting vessel, you can open your MobiGlas and request ship services just as you would at any station or outpost. This first release makes the feature available on the AI Idris in the Tactical Strike Groups mission as well as some of the current larger ships.</p><p>With this update, players will be able to use their Idris, Polaris, and 890j to refuel ships that are fully able to land in their hangars while some ships such as the 600i explorer and Carrack are meant to be able to restock ground vehicles that fit.</p><p><strong><u>How It Works</u></strong></p><ul><li>Land in the hangar of a ship that offers servicing and remain seated in your ship</li><li>Open your MobiGlas and navigate to the Vehicle Maintenance Services app, the same interface used at landing zones and stations</li><li>Request repair, restock, or refuel as needed; multiple ships can be serviced simultaneously</li><li>Services do not require any action from the crew of the ship</li><li>The feature is active during the Tactical Strike Groups mission on the AI Idris</li></ul><p><strong><u>Economy and Supplies</u></strong></p><ul><li>Ship service commodities are now purchasable at commodity shops across the Persistent Universe</li><li>Ammunition, countermeasures, Quantum Fuel, Hydrogen Fuel, and Raw Materials Composites (RMC) are available at admin offices. Seraphim Station, TDD locations, and admin offices at major stations now carry these materials</li><li>Pricing is set by the AI ship for this release and is not adjustable by players yet</li></ul><p><br></p><h3><u>Ship Armor &amp; Shield Balance</u></h3><p>Upwards adjustments have been made to armor deflection of larger ships, including cap ships. Updated the ships sitting between heavy fighters and large ships like the hammerhead to have their own armor balancing (Such as Redeemer and Constellation series). Shield updates to shield components across the board to adjust health, shield resistance, and health regen. This update will see most shields have a health pool reduction around 20% while most shield regen speeds increased.</p><p><br></p><h3><u>Weapon, Ammo, Munitions, and Component Adjustments</u></h3><p>Ballistic ammo SCU sizes have been greatly reduced to about 10% of their previous cargo sizes.</p><p>Attrition Weapons have had a balance pass to reduce their damage by a significant amount while increasing heat per second and increasing charge up time.</p><p>With this update you will see wide pricing updates to ship components, weapons, and munitions. This will see many components get increases to cost while some will have significant reductions in price such as certain fuel tanks, missiles, torps, and more.</p><p><br></p><h3><u>Additional Ship Updates</u></h3><ul><li>Vehicle Uneditable / Editable itemport sweep: Full item port audit for all ships to make sure ship components are at the correct setup for editable or uneditable</li><li>All Pirate Caterpillars have been converted to Caterpillar + Paint</li><li>More ships added to aUEC shops: Perseus, RSI Salvation, Drake Clipper, RSI Hermes, and MDC</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}},{&quot;title&quot;:&quot;Characters & AI:  New Player Hairstyles & Updates&quot;,&quot;content&quot;:&quot;<h3><u>New Player Hairstyles</u></h3><p>Implementing seven new hairstyles and one new beard, along with updates to one hairstyle and one beard to bring them up to current quality standards.</p>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}},{&quot;title&quot;:&quot;Weapons & Items: New FPS Items - Flight Suits&quot;,&quot;content&quot;:&quot;<h3><u>New FPS Weapon: UltiFlex Crossbow</u></h3><p>Implementing the long-awaited crossbow, featuring a devastating, shattering bolt and harsh projectile drop, the UltiFlex Crossbow rewards skilled aim with immense power. Its near-silent firing mechanism lets you strike quietly and gain the upper hand on your foes.</p><h3><br></h3><h3><u>New FPS Weapon: Kastak Arms - Plasma Grenade</u></h3><p>Implementing Kastak Arms area-denial grenade. Prime and throw to lock down an area and prevent enemies from pushing through.</p><p>The Kastak Arms Plasma Grenade is the first area-denial grenade in Star Citizen. Unlike fragmentation grenades that deliver a single explosion, the Plasma Grenade detonates repeatedly after landing, unleashing a sustained series of plasma bursts that make the affected zone extremely dangerous to push through. It is designed to hold positions, flush enemies out of cover, and punish opponents who try to advance through a doorway or corridor. Prime it, throw it, and let the grenade do the work.</p><p><strong><u>Key Mechanics</u></strong></p><ul><li>Detonates repeatedly after landing, producing a sustained zone of plasma explosions for several seconds</li><li>Deals Energy (Plasma) damage with each detonation within a 15-meter effective radius</li><li>Has no arming time and begins its detonation sequence on a timed fuse after being thrown</li><li>Can be shot mid-flight to trigger early detonation before it reaches the intended landing point</li><li>Designed to deny movement through a zone rather than deliver a single high-damage burst</li></ul><p><strong><u>Tactical Use</u></strong></p><ul><li>Most effective in chokepoints, doorways, corridors, and any area where enemies must pass through to advance</li><li>Coordinate with teammates to force enemies into the denial zone rather than letting them wait it out in cover</li><li>The grenade can be intercepted and detonated early by enemy fire, so time your throw carefully in contested space</li><li>Available for purchase at weapons vendors and found in the world as loot</li></ul><p>&nbsp;</p><h3><u>New Clothing/Armor</u></h3><p>Many flight suits have been added to shops around the universe. The purchase locations include Cousin Crow's, Tammany and Sons, Cubby Blast, Omega Pro, Skutters, Cordry's, and Black Market armor stalls in checkmate</p><p><br></p><p><br></p><h3><u>Additional Weapon and Item Updates</u></h3><ul><li>BOOMTUBE Rocket Launcher Balance Update: Blast radius reduced from 2.5m to 1.5m (40% smaller explosion). Physical damage reduced from 25,000 to 20,000 (-20%). Energy damage reduced from 25,000 to 21,000 (-16%)</li></ul>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}},{&quot;title&quot;:&quot;Core Tech & Audio: Experimental VR Updates - Experimental D-BOX Haptic Support&quot;,&quot;content&quot;:&quot;<h3><u>Virtual Reality Updates (Experimental)</u></h3><ul><li>F Prompts are rendered in world now and no longer in screenspace so they work natively with VR</li><li>Adding new 3D FPS Crosshair and Hitmarkers for VR. Enabled via cvar w_crosshair_3d which is on by default for VR</li></ul><p>&nbsp;&nbsp;Note: The new 3D Crosshair looks very similar albeit not identical to the 2D version. Also the 3D version doesn't do any smoothing to it which feels more natural in VR and is tricky to do in 3d space so it still feels responsive enough for FPS</p><p>&nbsp;&nbsp;The Crosshair is also aligned to the weapon helper and no longer in screenspace, i.e. if you lean to the right the crosshair rotates. Imo this looks better and has a coolness effect so i'm keeping this for now</p><p><br></p><ul><li>Fix shadow issue in some cases where the stereo-shift wasnt considered</li><li>Fix VR cropping with fullscreen theater mode - Fix incorrect mouse confine when changing resolutions due to renderer vars not yet updated which the hw mouse was querying</li><li>Renamed IsStereoModeEnabled -&gt; IsVREnabled to make it more clear that this also means the TheaterMode can be active</li><li>Maintain resolutions across all VR modes when turning off/on any mode (i.e. theater to non-vr, non-vr to theater etc)</li><li>Enable stereostrength scaling in editor without gamemode if strength is smaller than 1</li><li>Disabled broken r_ResolutionScale in VR</li><li>Disabled pl_proceduralRecoil.enableHeadRecoil in VR as it feels very unnatural and causes motion sickness</li></ul><p><br></p><p><br></p><h3><u>Haptic Feedback Support - D-BOX (Experimental)</u></h3><p>This released brings the very first integration of the D-BOX SDK and enable support for their haptic systems. This is the first in what will be a series of updates to our motion telemetry support, and for the time being it is considered experimental.</p><p>Star Citizen is a game built around the fantasy of being in the cockpit, and we want the physical experience to match what's on screen or headset. We know our players have been building incredible custom cockpits and simrigs setups of every shape and size, from compact desk rigs, spherical displays, and custom physical cockpits all the way to a literal bus (omg!). We want the game to be able to leverage that hardware to bring you the next level of immersion.</p><p><strong> Learn more at </strong><a href=\&quot;https://www.d-box.com/star-citizen\&quot; rel=\&quot;noopener noreferrer\&quot; target=\&quot;_blank\&quot;><strong>https://www.d-box.com/star-citizen</strong></a></p><p><strong>// What is a haptic platform?</strong></p><p>A haptic system is built from motion actuators, which are motor-driven units that mount under your seat or rig. Each actuator can produce two types of output: physical movement (pushing the platform up and down) and haptic rumble, which can range from subtle fine vibrations you barely notice to deep reverberations that move the entire rig.</p><p>A basic two-actuator setup gives two degrees of freedom: Roll and Pitch, as well as vibrations and texture. Four-actuator configurations add more range and precision with a third degree of freedom added: Heave.. Higher-end setups running up to eight actuators can support full Sway, Surge and Yaw on top of that. D-BOX is one of the leading manufacturers of these systems, and their technology is what we've integrated with for this release.</p><p><br></p><p><strong>// What's supported in this release?</strong></p><p>We focused this first pass entirely on the cockpit experience. Everything integrated so far is tuned for space and atmospheric flight:</p><ul><li>Ship engine rumble</li><li>Directional G-forces</li><li>Directional hits (with attenuation based on shields vs. hull damage)</li><li>Missile launches</li><li>Countermeasure launches</li><li>Landing gear movement</li><li>Decouple/couple engagement</li><li>Weapons and gun recoil</li><li>Boost and afterburner</li><li>Impacts and explosions</li></ul><p><br></p><p><strong>// What can I expect?</strong></p><p>The goal of this integration is to make piloting feel visceral, especially in combat.</p><p>You'll feel your ship's engine rumble scale with its size, so a Pisces hums while a Hammerhead growls through your seat. Hitting afterburner or boost gives you a real kickback. Firing weapons produces recoil that matches the output and launching missiles or popping countermeasures each have their own reaction. When something hits your ship, the impact is directional and attenuated based on whether your shields absorbed it or it punched through to hull. A glancing hit against full shields feels very different from a torpedo connecting with bare armor.</p><p>Beyond combat, the platform responds to the G-forces your pilot is experiencing, so hard turns, acceleration, and deceleration all translate to physical movement in your seat. Deploying and retracting landing gear has its own tactile signature and switching into decouple mode gives you a distinct engagement feel, so you know the moment your flight model changes. When it all comes together, your body starts reacting before your brain does. That's when you know the immersion is working.</p><p>Note that this release is focused on the pilot seat experience. Turret positions have a preliminary pass for weapon fire and movement, but broader multi-crew coverage and FPS/EVA are not covered yet and are on our radar for future updates.</p><p><br></p><p><strong>// How do I activate it?</strong></p><p>If you have a D-BOX system, install the motion code for Star Citizen and it will automatically detect the haptic system and start processing telemetry. The platform should initialize its up/down cycle. That's it.</p><p>You can grab the motion code by accessing D-BOX HaptiSync Center. There is no need to configure anything on your game client to activate the integration.</p>&quot;,&quot;visual&quot;:{&quot;displayed&quot;:true}}]"></g-faq><div class="turbo-anchor" id="77f903ad" data-plugin_key="plugin_trblt_rawmarkup" data-position="17"></div><A NAME="BugFixes"></A><div data-arrangement_key="fit-content-grid" class="turbo-anchor" id="edd32b04" data-plugin_key="plugin_trblt_banner_advanced" data-position="18"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:true,&quot;alignment&quot;:&quot;left-bottom&quot;,&quot;overlay&quot;:{&quot;displayed&quot;:true,&quot;opacity&quot;:0.75},&quot;logo&quot;:{&quot;displayed&quot;:false},&quot;box&quot;:{&quot;displayed&quot;:false},&quot;text&quot;:{&quot;displayed&quot;:true,&quot;overline&quot;:&quot;&quot;,&quot;title&quot;:&quot;Bug Fixes & Technical Updates&quot;,&quot;subtitle&quot;:&quot;&quot;,&quot;paragraph&quot;:&quot;<h1><br></h1>&quot;},&quot;callToAction&quot;:{&quot;displayed&quot;:false},&quot;semanticTag&quot;:{&quot;title&quot;:&quot;h2&quot;,&quot;subtitle&quot;:&quot;h3&quot;}}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/71ef891a0d6cf64a81ccfafa3944bb921f55d8ea/resize(3000,643,cover,crop(3840,823,192,0,2VZXybTSZJq1Tjzqbwq3TJWePfe4sj36mh6Z312Vrv8ypCV95wJnU1zjW6LJ9yQiadAH2WVmmdKjdAjjtY41NVMv8x8fFBkJzA2o6amvH1sS4rRZ2 v class="turbo-anchor" id="d0f5b658" data-plugin_key="plugin_trblt_narrative" data-position="19"></div><g-narrative-group :background-options="{&quot;isTransparent&quot;:false}" v-cloak=""><g-article :show-emphasis="false" body="<p><strong>Star Citizen Alpha contains over 166 bug and crash fixes since 4.7.0. 73 of which originated from the issue council.</strong></p><p><br></p><h3><strong><u>Stability &amp; Performance</u></strong></h3><ul><li><strong>Client Crash Fixes: 17 fixes</strong></li><li><strong>Server Crash Fixes: 4 fixes</strong></li><li><strong>Fixed multiple Main-Thread Deadlocks</strong></li></ul><p><br></p><h3><strong><u>Bug Fixes</u></strong></h3><p><br></p><p><strong>Inventory</strong></p><ul><li>Fixed an issue where hovering over equipment slots in the inventory did not highlight the correct corresponding items.</li><li>Fixed an issue where the hand carry icon was missing from the inventory UI.</li><li>Fixed an issue where items dragged into equipment slots would sometimes fail to equip.</li><li>Fixed an issue where the Place in Hand slot was missing from the inventory loadout selection.</li><li>Fixed an issue where the vehicle item port inventory panel would flash briefly and immediately close on interaction, leaving it unusable for the rest of the session.</li><li>Players should no longer be blocked from accessing ship storage due to their actor height.</li><li>Fixed an issue where capacity and available space values in the personal inventory were not updating correctly when items were moved.</li><li>Fixed an issue where the Stack All button in the personal and local inventory would cause flickering and leave items in a pending move state.</li><li>Fixed an issue where auto-stacking behavior was inconsistent in the personal inventory.</li><li>Fixed an issue where streaming out of and back into a QV Station location could cause the inventory to stop functioning entirely.</li><li>Fixed an issue where players could loot invisible equipped items from NPC corpses through the loot screen.</li></ul><p><strong>Missions</strong></p><ul><li>Fixed an issue where higher difficulty Ambush contracts were not appearing after completing a lower tier contract.</li><li>Fixed an issue where Ambush missions had an excessively long cooldown before new contracts repopulated in an area.</li><li>Fixed an issue where the Nyx recover cargo mission could become stuck at the Go to objective and fail to progress.</li><li>Fixed an issue where the bounty hunter scan target would sometimes not appear at the mission location in Nyx.</li><li>Fixed an issue where salvage claim missions were not available in Nyx.</li><li>Fixed an issue where no enemy AI were spawning inside Pyro Contested Zones.</li><li>Fixed an issue where reward rooms at the end of Pyro Contested Zones contained no loot.</li><li>Fixed an issue where the maintenance access keycard was not spawning during Storm Breaker.</li></ul><p><strong>Combat and Weapons</strong></p><ul><li>Fixed an issue where heavy fighters using a specific armor configuration were fully immune to damage from size 1 through 3 weapons of both damage types.</li><li>Fixed an issue where ship damage maps were registering multiple impacts from a single projectile or missile hit, causing exaggerated damage.</li><li>Fixed an issue where the Idris laser was not dealing damage to target vehicles when striking their doors.</li><li>Fixed an issue where the NN-14 Neutron Cannon had an incorrectly high capacitor shot count on a single weapon.</li><li>Fixed an issue where the NN-14 Neutron Cannon had an incorrectly fast recharge rate.</li><li>Fixed an issue where the NN-15 Cannon was displaying as NN-14 in the VMA.</li><li>Fixed an issue where Panther repeaters had a significantly faster recharge cooldown than other equivalent weapon sizes.</li></ul><p><strong>Vehicles and Ships</strong></p><ul><li>Fixed an issue where ground vehicle mass boxes would detach on vehicle death and collide with the wreck, causing erratic movement.</li><li>Fixed an issue where AI ship combat showed significant desync, jitter, and teleportation.</li><li>Fixed an issue where the RSI Hermes was not available in Arena Commander.</li><li>Fixed an issue where the MISC Hull A shield was incorrectly covering large portions of the spindle plates.</li><li>Fixed an issue where the MISC Hull B top bunk bed had no exit interaction prompt.</li><li>Fixed an issue where the MISC Hull B elevator had a visarea rendering issue when viewed from beneath the hull.</li><li>Fixed an issue where the MISC Hull B bed lights in the hab compartment could flash in emergency mode when the room lighting was set to auxiliary.</li><li>Fixed an issue where the RSI Aurora Mk2 radar component could not be detached from its receptacle.</li><li>Fixed an issue where some ships displayed incorrect text on their exterior elevator screens.</li><li>Fixed an issue where the Drake Corsair landing and navigation lights were excessively bright.</li><li>Fixed an issue where only two of the Greycat UTV's seven headlights were activating.</li><li>Fixed an issue where the weapon rack position on the Greycat UTV was offset.</li><li>Fixed an issue where damage was not propagating correctly to certain Greycat UTV components.</li><li>Fixed an issue where a placeholder component label was visible at the front of the Greycat UTV.</li></ul><p><strong>Characters and Equipment</strong></p><ul><li>Fixed an issue where the mutton chop facial hair used incorrect geometry when a helmet was equipped.</li><li>Fixed an issue where the Voidripper helmet series lost its pickup interaction prompt after being dropped on the ground.</li><li>Fixed an issue where the interior geometry of the Aves helmet was visible through the lens shader.</li><li>Fixed an issue where Argus helmet variants were incorrectly allowing the wearer to breathe in space despite not being vacuum-sealed.</li><li>Fixed an issue where the Duck Flat Cap was missing its shop display geometry.</li></ul><p><strong>UI and MobiGlas</strong></p><ul><li>Fixed an issue where the scroll bar on several mobiGlas apps could not be used manually.</li><li>Fixed an issue where the Hockrow Agency logo was missing from the Reputation app.</li><li>Fixed an issue where the ASOP local storage filter toggle had no text labels.</li><li>Fixed an issue where the Ship Ambush countdown timer displayed a raw string placeholder before the time value.</li></ul><p><strong>Locations</strong></p><ul><li>Fixed an issue where players were able to walk through Distribution Center hangar doors.</li><li>Fixed an issue where the majority of the Nyx RCD facility was missing labels on the minimap.</li><li>Fixed an issue where an invisible collision proxy in the Nyx RCD cargo room was blocking movement in front of a door.</li><li>Fixed an issue where geometry in the Levski docking ports was offset from its intended position.</li><li>Fixed an issue where a placeholder item was visible in the shopping kiosk at the Checkmate Contested Zone.</li><li>Fixed an issue where the side doors on the lower level of the Polaris at Nyx logistics stations had a visarea rendering error.</li></ul><p><strong>Audio and VOIP</strong></p><ul><li>Fixed an issue where voice comms calls in Nyx missions were cutting off before completing their audio.</li><li>Fixed an issue where VOIP audio was intermittently absent during sessions.</li><li>Fixed an issue where the mining laser sound effect cut out when entering the lens alignment chamber at the Nyx RCD.</li></ul><p><strong>Mining</strong></p><ul><li>Fixed an issue where mining nodes across the universe were set to an excessively high difficulty, with most nodes showing as Impossible.</li><li>Fixed an issue where ASD dungeon stalagmites were displaying an incorrect quality label.</li><li>Fixed an issue where Bexalite surface rare rocks were incorrectly classified with the Beryl composition profile.</li></ul><p><strong>Performance</strong></p><ul><li>Fixed an issue causing client frame rate to drop to approximately 6 FPS inside the Wikelo Hangar during The Collector missions.</li><li>Reduced draw call and polygon count in the Nyx RCD laser room which was exceeding performance budget.</li><li>Fixed a high-cost camera visarea query that was occurring inside the Caterpillar wreck site interior.</li></ul><p><strong>Arena Commander</strong></p><ul><li>Fixed an issue where players were not receiving the 2953 Vanduul Aggressor badge upon reaching Wave 25 in Endless Vanduul Swarm.</li></ul><p><strong>Connectivity</strong></p><ul><li>Fixed a disconnection error that could prevent a character from spawning due to an invalid streaming root.</li><li>Fixed an issue where freight elevator delivery code was missing error handling that could result in item loss during cargo orders.</li></ul>" v-cloak=""></g-article></g-narrative-group><div class="turbo-anchor" id="c0794a69" data-plugin_key="plugin_trblt_rawmarkup" data-position="20"></div><A NAME="KnownIssues"></A><div data-arrangement_key="fit-content-grid" class="turbo-anchor" id="c89a71d1" data-plugin_key="plugin_trblt_banner_advanced" data-position="21"></div><g-banner-advanced :background-options="{&quot;isTransparent&quot;:false}" :content="{&quot;displayed&quot;:true,&quot;alignment&quot;:&quot;left-bottom&quot;,&quot;overlay&quot;:{&quot;displayed&quot;:true,&quot;opacity&quot;:0.75},&quot;logo&quot;:{&quot;displayed&quot;:false},&quot;box&quot;:{&quot;displayed&quot;:false},&quot;text&quot;:{&quot;displayed&quot;:true,&quot;overline&quot;:&quot;&quot;,&quot;title&quot;:&quot;\nKnown Issues & Information&quot;,&quot;subtitle&quot;:&quot;&quot;,&quot;paragraph&quot;:&quot;&quot;},&quot;callToAction&quot;:{&quot;displayed&quot;:false},&quot;semanticTag&quot;:{&quot;title&quot;:&quot;h2&quot;,&quot;subtitle&quot;:&quot;h3&quot;}}" :media="{&quot;background&quot;:{&quot;picture&quot;:{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/98e0e793f63542a27c9ba66e61a1be060fd56199/resize(1280,274,cover,c 3-Known-Issues&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;><strong>Knowledge Base here</strong></a>!</p><p><br></p><h2>Known Issues</h2><ul><li>PU - Missions / UI - Mission QT target moving away rapidly through space</li><li>Multivehicle - PU - Vehicles / Ship Feature - While travelling through Jump Tunnels, QT, or general flight the vehicles may switch into SCM GUN mode</li><li>Live grenades are not displaying a HUD warning marker to nearby players.</li><li>Multiple laptops can spawn in the Auxiliary Station during the Welcome to Nyx mission, making it unclear which code is correct.</li><li>The Boomtube Rocket Launcher sight is misaligned when aiming down sights while prone.</li><li>Players can become stuck in the hangar queue after attempting to take off, with the hangar doors failing to open.</li><li>Some locations and quantum beacon nav markers cannot be routed to or quantum traveled to.</li><li>Retrieving a vehicle from the ASOP terminal may incorrectly show the ship's status as Destroyed or Unknown.</li><li>The Argo MOTH can use its salvage turrets even when power has been disabled to them.</li><li>The Item Fabricator jitters and moves erratically when placed on surfaces using the tractor beam.</li><li>Jump point stations in Nyx and Pyro are using an incorrect armor shop configuration, causing store mannequins to appear without armor.</li><li>The personal hangar option appears at the bottom of the elevator destination list rather than at the top.</li><li>Loot boxes can lose their interaction prompt if the interact key is pressed twice in quick succession.</li></ul>" v-cloak=""></g-article></g-narrative-group><div id="aria-skin-info" data-orion-skin="generic.default.base-" style="position:absolute; top:0, left:0;"></div>
